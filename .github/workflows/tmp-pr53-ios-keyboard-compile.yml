name: Temporary PR53 iOS keyboard compile

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: pr53-ios-keyboard-compile-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  ios-keyboard-compile:
    if: github.event.pull_request.number == 53
    runs-on: macos-26
    timeout-minutes: 35
    steps:
      - name: Check out exact pull-request head
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '24.18.0'
          cache: npm
      - name: Require Xcode 26 or newer
        run: |
          xcodebuild -version
          xcode_major="$(xcodebuild -version | awk '/^Xcode / { split($2, version, "."); print version[1] }')"
          test -n "$xcode_major"
          test "$xcode_major" -ge 26
      - name: Install exact dependencies
        run: npm ci
      - name: Prove focused keyboard and dictation contracts
        run: |
          node --test \
            tests/answer-keyboard.test.mjs \
            tests/ios-keyboard-presentation.test.mjs \
            tests/ios-keyboard-ownership.test.mjs \
            tests/ios-dictation-input-session.test.mjs \
            tests/ios-project-contract.test.mjs
      - name: Materialise and verify native project
        run: npm run native:sync:check
      - name: Compile unsigned product iOS Simulator application
        run: npm run test:ios
