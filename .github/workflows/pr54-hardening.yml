name: PR54 Words hardening

on:
  pull_request:
    branches:
      - main
    types: [opened, reopened, synchronize, edited]

permissions:
  contents: read

concurrency:
  group: pr54-words-hardening-${{ github.event.pull_request.number }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  harden:
    if: github.event.pull_request.head.ref == 'agent/words-search-vocabulary-sets-clean'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out the exact PR branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          ref: agent/words-search-vocabulary-sets-clean

      - name: Normalize the reviewed Word Bank JSX
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/app/ProductApp.jsx')
          source = path.read_text()
          pairs = [
              (
                  """  const bank = useMemo(
            () => buildWordBank({
              progress,
              filter,
              vocabSet,
              vocabularySets,
              query,
            }),
            [progress, filter, vocabSet, vocabularySets, query],
          );""".replace('            ()', '  ()').replace('              progress', '    progress').replace('              filter', '    filter').replace('              vocabSet', '    vocabSet').replace('              vocabularySets', '    vocabularySets').replace('              query', '    query').replace('            }),', '  }),').replace('            [progress', '  [progress').replace('          );', ');'),
                  """  const bank = useMemo(
    () => buildWordBank({
      progress,
      filter,
      vocabSet,
      vocabularySets,
      query,
    }),
    [progress, filter, vocabSet, vocabularySets, query],
  );""",
              ),
              (
                  """            <span
            id="bank-result-count"
            className="figure"
            role="status"
            aria-live="polite"
            aria-atomic="true"
          >
            {bank.countLabel}
          </span>""",
                  """            <span
              id="bank-result-count"
              className="figure"
              role="status"
              aria-live="polite"
              aria-atomic="true"
            >
              {bank.countLabel}
            </span>""",
              ),
              (
                  """              enterKeyHint="search"
            maxLength={64}
            aria-describedby="bank-result-count"
            onChange={(event) => setQuery(event.target.value)}
            onKeyDown={(event) => {
              if (event.key === 'Escape' && query) {
                event.preventDefault();
                setQuery('');
              }
            }}
            />""",
                  """              enterKeyHint="search"
              maxLength={64}
              aria-describedby="bank-result-count"
              onChange={(event) => setQuery(event.target.value)}
              onKeyDown={(event) => {
                if (event.key === 'Escape' && query) {
                  event.preventDefault();
                  setQuery('');
                }
              }}
            />""",
              ),
              (
                  """                aria-pressed={option.selected}
              aria-label={`${option.label}, ${option.count} ${option.count === 1 ? 'word' : 'words'}`}
              onClick={() => setVocabSet(option.id)}""",
                  """                aria-pressed={option.selected}
                aria-label={`${option.label}, ${option.count} ${option.count === 1 ? 'word' : 'words'}`}
                onClick={() => setVocabSet(option.id)}""",
              ),
              (
                  """                aria-pressed={option.selected}
              aria-label={`${option.label}, ${option.count} ${option.count === 1 ? 'word' : 'words'}`}
              onClick={() => setFilter(option.id)}""",
                  """                aria-pressed={option.selected}
                aria-label={`${option.label}, ${option.count} ${option.count === 1 ? 'word' : 'words'}`}
                onClick={() => setFilter(option.id)}""",
              ),
              (
                  """      <WordBankScreen
      progress={learningState.progress}
      vocabularySets={learningState.vocabularySets}
      onScreen={showScreen}
        onStart={() => showScreen('setup')}""",
                  """      <WordBankScreen
        progress={learningState.progress}
        vocabularySets={learningState.vocabularySets}
        onScreen={showScreen}
        onStart={() => showScreen('setup')}""",
              ),
          ]
          for bad, good in pairs:
              count = source.count(bad)
              if count != 1:
                  raise SystemExit(f'unexpected JSX topology for reviewed hunk: {count}')
              source = source.replace(bad, good, 1)
          path.write_text(source)
          PY

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "24.18.0"
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Verify the normalized Words product
        run: |
          node --test \
            tests/word-bank-model.test.mjs \
            tests/product-learning-controller.test.mjs \
            tests/product-app-services.test.mjs \
            tests/app-shell.test.mjs
          npm run lint -- --quiet
          npm run build
          git diff --check
          test "$(git diff --name-only)" = "src/app/ProductApp.jsx"

      - name: Retain the exact normalized source
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr54-normalized-product-app
          path: src/app/ProductApp.jsx
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
