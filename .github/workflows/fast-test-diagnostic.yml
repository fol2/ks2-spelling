name: Temporary fast-test diagnostic

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: fast-test-diagnostic-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  diagnose:
    name: Direct dependency-audit failure
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Fetch the exact pull-request head quietly
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          git init -q .
          git remote add origin "https://github.com/${REPOSITORY}.git"
          git fetch -q origin "$HEAD_SHA"
          git checkout -q --detach FETCH_HEAD
      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "24.18.0"
          cache: npm
      - name: Install exact dependencies quietly
        run: npm ci --silent --no-audit --no-fund
      - name: Run the pre-bootstrap audit directly
        run: |
          node --input-type=module <<'NODE'
          import { buildDependencyArtifacts } from './scripts/audit-dependencies.mjs';

          try {
            const { report } = await buildDependencyArtifacts({ preBootstrap: true });
            console.log(JSON.stringify({
              result: 'passed',
              webViewPackages: report.npm.webViewBundle.packageNames,
              productionCount: report.npm.production.length,
            }, null, 2));
          } catch (error) {
            console.error(JSON.stringify({
              result: 'failed',
              name: error?.name,
              code: error?.code,
              message: error?.message,
            }, null, 2));
            process.exit(1);
          }
          NODE
