name: PR54 final source gate

on:
  push:

permissions:
  contents: write

concurrency:
  group: pr54-final-source-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  finalize:
    if: >-
      github.ref == 'refs/heads/agent/words-search-vocabulary-sets-clean' &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out the exact PR branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          ref: agent/words-search-vocabulary-sets-clean

      - name: Normalize the reviewed JSX hunks
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/app/ProductApp.jsx')
          source = path.read_text()
          replacements = [
              (
                  """  const bank = useMemo(
            () => buildWordBank({
              progress,
              filter,
              vocabSet,
              vocabularySets,
              query,
            }),
            [progress, filter, vocabSet, vocabularySets, query],
          );""".replace('            ()', '  ()').replace('              progress', '    progress').replace('              filter', '    filter').replace('              vocabSet', '    vocabSet').replace('              vocabularySets', '    vocabularySets').replace('              query', '    query').replace('            }),', '  }),').replace('            [progress', '  [progress').replace('          );', ');'),
                  """  const bank = useMemo(
              () => buildWordBank({
                progress,
                filter,
                vocabSet,
                vocabularySets,
                query,
              }),
              [progress, filter, vocabSet, vocabularySets, query],
            );""",
              ),
              (
                  """            <span
            id="bank-result-count"
            className="figure"
            role="status"
            aria-live="polite"
            aria-atomic="true"
          >
            {bank.countLabel}
          </span>""",
                  """            <span
              id="bank-result-count"
              className="figure"
              role="status"
              aria-live="polite"
              aria-atomic="true"
            >
              {bank.countLabel}
            </span>""",
              ),
              (
                  """              enterKeyHint="search"
            maxLength={64}
            aria-describedby="bank-result-count"
            onChange={(event) => setQuery(event.target.value)}
            onKeyDown={(event) => {
              if (event.key === 'Escape' && query) {
                event.preventDefault();
                setQuery('');
              }
            }}
            />""",
                  """              enterKeyHint="search"
              maxLength={64}
              aria-describedby="bank-result-count"
              onChange={(event) => setQuery(event.target.value)}
              onKeyDown={(event) => {
                if (event.key === 'Escape' && query) {
                  event.preventDefault();
                  setQuery('');
                }
              }}
            />""",
              ),
              (
                  """                aria-pressed={option.selected}
              aria-label={`${option.label}, ${option.count} ${option.count === 1 ? 'word' : 'words'}`}
              onClick={() => setVocabSet(option.id)}""",
                  """                aria-pressed={option.selected}
                aria-label={`${option.label}, ${option.count} ${option.count === 1 ? 'word' : 'words'}`}
                onClick={() => setVocabSet(option.id)}""",
              ),
              (
                  """                aria-pressed={option.selected}
              aria-label={`${option.label}, ${option.count} ${option.count === 1 ? 'word' : 'words'}`}
              onClick={() => setFilter(option.id)}""",
                  """                aria-pressed={option.selected}
                aria-label={`${option.label}, ${option.count} ${option.count === 1 ? 'word' : 'words'}`}
                onClick={() => setFilter(option.id)}""",
              ),
              (
                  """      <WordBankScreen
      progress={learningState.progress}
      vocabularySets={learningState.vocabularySets}
      onScreen={showScreen}
        onStart={() => showScreen('setup')}""",
                  """      <WordBankScreen
        progress={learningState.progress}
        vocabularySets={learningState.vocabularySets}
        onScreen={showScreen}
        onStart={() => showScreen('setup')}""",
              ),
          ]
          for old, new in replacements:
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'expected one exact JSX normalization target, found {count}')
              source = source.replace(old, new, 1)
          path.write_text(source)
          PY

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "24.18.0"
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Run the final Words verification
        run: |
          node --test \
            tests/word-bank-model.test.mjs \
            tests/product-learning-controller.test.mjs \
            tests/product-app-services.test.mjs \
            tests/app-shell.test.mjs
          npm run lint -- --quiet
          npm run build
          git diff --check

      - name: Commit only the normalized product source
        run: |
          git add src/app/ProductApp.jsx
          test -n "$(git diff --cached --name-only)"
          test "$(git diff --cached --name-only)" = "src/app/ProductApp.jsx"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style(words): normalize the hardened Word Bank"
          git push origin HEAD:agent/words-search-vocabulary-sets-clean
