name: PR56 preserve Return-key focus

on:
  pull_request:
    branches:
      - main
    types: [opened, reopened, synchronize]
    paths:
      - '.github/workflows/pr56-return-key-focus-hardening.yml'
      - 'spikes/flutter_ks2_spelling/lib/spelling_spike_app.dart'
      - 'spikes/flutter_ks2_spelling/test/spelling_spike_app_test.dart'

permissions:
  contents: write

concurrency:
  group: pr56-return-key-focus-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  harden:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'spike/flutter-flame-vertical-slice'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out the exact spike head
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Prove the pull-request head is exact
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$PR_HEAD_SHA"

      - name: Keep the platform input connection across Return and save
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path_name: str, old: str, new: str) -> None:
              path = Path(path_name)
              source = path.read_text()
              count = source.count(old)
              if count != 1:
                  raise SystemExit(
                      f'{path_name}: expected one replacement, found {count}'
                  )
              path.write_text(source.replace(old, new, 1))

          app = 'spikes/flutter_ks2_spelling/lib/spelling_spike_app.dart'
          replace_once(
              app,
              '                                textInputAction: TextInputAction.done,',
              '                                textInputAction: TextInputAction.unspecified,',
          )

          test = 'spikes/flutter_ks2_spelling/test/spelling_spike_app_test.dart'
          old_field_contract = (
              '  expect(input.readOnly, isFalse);\n'
              '  expect(input.inputFormatters, hasLength(1));\n'
              '  return inputFinder;'
          )
          new_field_contract = (
              '  expect(input.readOnly, isFalse);\n'
              '  expect(input.inputFormatters, hasLength(1));\n'
              '  expect(input.textInputAction, TextInputAction.unspecified);\n'
              '  return inputFinder;'
          )
          replace_once(test, old_field_contract, new_field_contract)

          old_submit_start = (
              "      await tester.enterText(inputFinder, 'accident');\n"
              "      final Finder submit = find.byKey(const Key('submit-button'));\n"
              '      await tester.ensureVisible(submit);\n'
              '      await tester.tap(submit);\n'
              '      await repository.recordStarted.future;\n'
              '      await tester.pump();\n'
              '\n'
              '      final TextField savingField = tester.widget<TextField>(inputFinder);'
          )
          new_submit_start = (
              "      await tester.enterText(inputFinder, 'accident');\n"
              "      final Finder submit = find.byKey(const Key('submit-button'));\n"
              '      await tester.ensureVisible(submit);\n'
              '      expect(tester.testTextInput.isVisible, isTrue);\n'
              '      await tester.testTextInput.receiveAction(\n'
              '        TextInputAction.unspecified,\n'
              '      );\n'
              '      await repository.recordStarted.future;\n'
              '      await tester.pump();\n'
              '\n'
              '      final Finder editableFinder = find.descendant(\n'
              '        of: inputFinder,\n'
              '        matching: find.byType(EditableText),\n'
              '      );\n'
              '      expect(\n'
              '        tester.widget<EditableText>(editableFinder).focusNode.hasFocus,\n'
              '        isTrue,\n'
              '      );\n'
              '      expect(tester.testTextInput.isVisible, isTrue);\n'
              '\n'
              '      final TextField savingField = tester.widget<TextField>(inputFinder);'
          )
          replace_once(test, old_submit_start, new_submit_start)

          old_submit_finish = (
              '      expect(finishedField.controller?.text, isEmpty);\n'
              '\n'
              '      await unmountAndVerifyCleanup(tester, delegate, audio);'
          )
          new_submit_finish = (
              '      expect(finishedField.controller?.text, isEmpty);\n'
              '      expect(\n'
              '        tester.widget<EditableText>(editableFinder).focusNode.hasFocus,\n'
              '        isTrue,\n'
              '      );\n'
              '      expect(tester.testTextInput.isVisible, isTrue);\n'
              '\n'
              '      await unmountAndVerifyCleanup(tester, delegate, audio);'
          )
          replace_once(test, old_submit_finish, new_submit_finish)
          PY

      - name: Install the pinned Flutter toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            libsqlite3-dev
          git clone --depth 1 --branch 3.44.7 \
            https://github.com/flutter/flutter.git \
            "$RUNNER_TEMP/flutter"
          test "$(git -C "$RUNNER_TEMP/flutter" rev-parse HEAD)" = \
            '84fc5cbb223bc12f83d65b647ff8a56caf779ffd'
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/flutter/bin/flutter" config --no-analytics
          "$RUNNER_TEMP/flutter/bin/flutter" precache --linux

      - name: Format, analyse and test the hardened slice
        working-directory: spikes/flutter_ks2_spelling
        run: |
          flutter pub get --enforce-lockfile
          dart format lib test
          flutter analyze
          flutter test

      - name: Commit the hardened source and remove one-use machinery
        run: |
          git diff --check
          git add \
            spikes/flutter_ks2_spelling/lib/spelling_spike_app.dart \
            spikes/flutter_ks2_spelling/test/spelling_spike_app_test.dart
          git rm .github/workflows/pr56-return-key-focus-hardening.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(spike): preserve focus across Return saves'
          git push origin HEAD:spike/flutter-flame-vertical-slice
