name: PR55 exact restack and verification

on:
  pull_request:
    branches:
      - agent/words-search-vocabulary-sets-clean
    types: [opened, reopened, synchronize]

permissions:
  contents: write

concurrency:
  group: pr55-exact-restack-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  restack:
    if: >-
      github.event.pull_request.head.ref == 'agent/keyboard-reset-visible-input' &&
      github.actor != 'github-actions[bot]'
    runs-on: macos-26
    timeout-minutes: 105
    env:
      WORDS_HEAD: ae7c5fabc82b561839dcd6db5972fe03637ae257
    steps:
      - name: Check out the exact keyboard-reset branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          ref: agent/keyboard-reset-visible-input

      - name: Merge the exact hardened Words head without committing
        run: |
          git fetch --no-tags origin \
            refs/heads/agent/words-search-vocabulary-sets-clean:refs/remotes/origin/agent/words-search-vocabulary-sets-clean
          test "$(git rev-parse origin/agent/words-search-vocabulary-sets-clean)" = "$WORDS_HEAD"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git merge --no-commit --no-ff "$WORDS_HEAD"
          python3 scripts/pr55-final-restack.py
          git diff --check HEAD

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "24.18.0"
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Verify the composed Words and keyboard product
        run: |
          node --test \
            tests/keyboard-reset-visible-input.test.mjs \
            tests/dependency-policy.test.mjs \
            tests/word-bank-model.test.mjs \
            tests/product-learning-controller.test.mjs \
            tests/product-app-services.test.mjs \
            tests/app-shell.test.mjs
          npm run test:fast
          npm run lint -- --quiet
          npm run build
          git diff --check HEAD

      - name: Verify native dependency and iOS composition
        run: |
          npm run native:sync:check
          npm run test:ios
          npm run sync:b4-development
          xcodebuild \
            -quiet \
            -project ios/App/App.xcodeproj \
            -scheme B4DevelopmentUITests \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath .native-build/pr55-final-restack \
            CODE_SIGNING_ALLOWED=NO \
            build-for-testing

      - name: Commit the exact two-parent stack and remove temporary machinery
        run: |
          git add src/app/ProductApp.jsx
          git rm \
            .github/workflows/pr55-final-restack.yml \
            scripts/pr55-final-restack.py
          git commit -m "merge: restack visible-input reset on hardened Words"
          test "$(git rev-parse HEAD^2)" = "$WORDS_HEAD"
          test ! -e .github/workflows/pr55-final-restack.yml
          test ! -e scripts/pr55-final-restack.py
          git push origin HEAD:agent/keyboard-reset-visible-input
