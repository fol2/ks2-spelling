name: Temporary remove native Keyboard plugin

on:
  pull_request:

permissions:
  contents: write

concurrency:
  group: remove-native-keyboard-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  patch:
    name: Remove the iOS Keyboard plugin at source
    if: github.event.pull_request.number == 53 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Check out the pull-request branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Detect whether the correction is still required
        id: guard
        run: |
          if grep -q '"@capacitor/keyboard"' package.json; then
            echo 'required=true' >> "$GITHUB_OUTPUT"
          else
            echo 'required=false' >> "$GITHUB_OUTPUT"
            echo 'The native Keyboard plugin is already absent.'
          fi

      - name: Set up Node.js
        if: steps.guard.outputs.required == 'true'
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '24.18.0'
          cache: npm

      - name: Set up Temurin 21
        if: steps.guard.outputs.required == 'true'
        uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Require Android API and Build Tools 36
        if: steps.guard.outputs.required == 'true'
        run: |
          test -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            'platform-tools' 'platforms;android-36' 'build-tools;36.0.0' >/dev/null

      - name: Install exact dependencies
        if: steps.guard.outputs.required == 'true'
        run: npm ci --no-audit --no-fund

      - name: Remove the package and regenerate native plugin graphs
        if: steps.guard.outputs.required == 'true'
        run: |
          npm uninstall --ignore-scripts @capacitor/keyboard
          npm run build
          npx --no-install cap sync

      - name: Update closed authorities and regression tests
        if: steps.guard.outputs.required == 'true'
        run: |
          python3 - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import re
          from pathlib import Path

          ROOT = Path('.')
          KEYBOARD_PACKAGE = '@capacitor/keyboard'

          def read(path: str) -> str:
              return (ROOT / path).read_text()

          def write(path: str, text: str) -> None:
              (ROOT / path).write_text(text)

          def read_json(path: str):
              return json.loads(read(path))

          def write_json(path: str, value) -> None:
              write(path, json.dumps(value, indent=2, ensure_ascii=False) + '\n')

          def sha256(path: str) -> str:
              return hashlib.sha256((ROOT / path).read_bytes()).hexdigest()

          policy_path = 'config/dependency-policy.json'
          policy = read_json(policy_path)
          policy['directDependencies'].pop(KEYBOARD_PACKAGE, None)
          policy['npmClassifications'].pop(KEYBOARD_PACKAGE, None)
          policy['approvedNativePlugins'] = [
              entry for entry in policy['approvedNativePlugins']
              if entry.get('packageName') != KEYBOARD_PACKAGE
          ]
          policy['allowedSources']['gradleLocalDependencies'] = [
              entry for entry in policy['allowedSources']['gradleLocalDependencies']
              if entry != 'project::capacitor-keyboard'
          ]
          generated_hashes = {
              'android/app/capacitor.build.gradle': sha256('android/app/capacitor.build.gradle'),
              'android/capacitor.settings.gradle': sha256('android/capacitor.settings.gradle'),
          }
          for entry in policy['gradleInputFiles']:
              if entry['path'] in generated_hashes:
                  entry['sha256'] = generated_hashes[entry['path']]
          write_json(policy_path, policy)

          provenance_path = 'provenance/b3-package-transition.json'
          provenance = read_json(provenance_path)
          provenance['allowedPackageDependencyAdditions'].pop(KEYBOARD_PACKAGE, None)
          write_json(provenance_path, provenance)

          authority_path = 'scripts/lib/b3-package-transition-authority.mjs'
          authority = read(authority_path)
          authority_pattern = re.compile(
              r"// C7 spelling feel parity \(2026-07-24 plan\):[\s\S]*?"
              r"export const C7_PLANNED_PACKAGE_DEPENDENCY_ADDITIONS = Object\.freeze\(\{\n"
              r"  '@capacitor/keyboard': '8\.0\.5',\n"
              r"\}\);"
          )
          authority_replacement = """// C7 keyboard chrome was reverted after physical iOS 27 evidence showed that
          // merely linking the native plugin changes WKWebView keyboard internals during
          // plugin load. The product keeps the standard iOS accessory bar instead.
          export const C7_PLANNED_PACKAGE_DEPENDENCY_ADDITIONS = Object.freeze({});"""
          authority, replacements = authority_pattern.subn(authority_replacement, authority, count=1)
          if replacements != 1:
              raise SystemExit('Expected one C7 Keyboard dependency authority block.')
          write(authority_path, authority)

          audit_path = 'scripts/audit-dependencies.mjs'
          audit = read(audit_path)
          audit = audit.replace(
              "  // The Keyboard plugin remains an audited native build source. Product\n"
              "  // JavaScript deliberately does not import or bundle its runtime facade.\n",
              '',
          )
          audit = re.sub(r"^\s*'@capacitor/keyboard',\n", '', audit, flags=re.MULTILINE)
          audit = re.sub(r"^\s*':capacitor-keyboard',\n", '', audit, flags=re.MULTILINE)
          audit = audit.replace(
              "Capacitor,Cordova,CapacitorCommunitySqlite,CapacitorApp,CapacitorHaptics,CapacitorKeyboard",
              "Capacitor,Cordova,CapacitorCommunitySqlite,CapacitorApp,CapacitorHaptics",
          )
          for forbidden in (KEYBOARD_PACKAGE, 'CapacitorKeyboard', ':capacitor-keyboard'):
              if forbidden in audit:
                  raise SystemExit(f'Native Keyboard authority remains in audit script: {forbidden}')
          write(audit_path, audit)

          app_shell_path = 'tests/app-shell.test.mjs'
          app_shell = read(app_shell_path)
          expected_line = "  '@capacitor/keyboard': '8.0.5',\n"
          if app_shell.count(expected_line) != 1:
              raise SystemExit('Expected one app-shell Keyboard version authority.')
          write(app_shell_path, app_shell.replace(expected_line, '', 1))

          dependency_test_path = 'tests/dependency-policy.test.mjs'
          dependency_test = read(dependency_test_path)
          dependency_test = dependency_test.replace(
              "  // 39 through C6; @capacitor/keyboard is the fortieth (C7).\n"
              "  assert.equal(report.npm.production.length, 40);",
              "  // The C6 dependency set remains; the native Keyboard plugin was removed.\n"
              "  assert.equal(report.npm.production.length, 39);",
              1,
          )
          old_keyboard_assertions = """  assert.ok(
            report.npm.production.some(({ name }) => name === '@capacitor/keyboard'),
            'the native Keyboard plugin must remain an audited production dependency',
          );
          assert.equal(
            report.npm.webViewBundle.packageNames.includes('@capacitor/keyboard'),
            false,
            'ordinary keyboard ownership must not require the Keyboard JavaScript facade',
          );
          """
          new_keyboard_assertions = """  assert.equal(
            report.npm.production.some(({ name }) => name === '@capacitor/keyboard'),
            false,
            'the Keyboard plugin must stay outside the installed production closure',
          );
          assert.equal(
            report.npm.webViewBundle.packageNames.includes('@capacitor/keyboard'),
            false,
            'ordinary keyboard ownership must not require the Keyboard JavaScript facade',
          );
          """
          if dependency_test.count(old_keyboard_assertions) != 1:
              raise SystemExit('Expected one dependency-policy Keyboard assertion block.')
          dependency_test = dependency_test.replace(
              old_keyboard_assertions,
              new_keyboard_assertions,
              1,
          )
          approved_line = "      '@capacitor/keyboard',\n"
          if dependency_test.count(approved_line) != 1:
              raise SystemExit('Expected one approved Keyboard plugin list entry.')
          dependency_test = dependency_test.replace(approved_line, '', 1)
          write(dependency_test_path, dependency_test)

          keyboard_test = r'''import assert from 'node:assert/strict';
          import { existsSync } from 'node:fs';
          import { readFile, readdir } from 'node:fs/promises';
          import { dirname, join, relative } from 'node:path';
          import test from 'node:test';
          import { fileURLToPath } from 'node:url';

          const ROOT = dirname(dirname(fileURLToPath(import.meta.url)));
          const KEYBOARD_PACKAGE = '@capacitor/keyboard';

          async function collectRuntimeSources(directory) {
            const entries = await readdir(directory, { withFileTypes: true });
            const files = [];
            for (const entry of entries) {
              const path = join(directory, entry.name);
              if (entry.isDirectory()) {
                files.push(...await collectRuntimeSources(path));
              } else if (/\.[cm]?[jt]sx?$/.test(entry.name)) {
                files.push(path);
              }
            }
            return files;
          }

          test('ordinary iOS fields retain native keyboard ownership', async () => {
            const [
              packageJsonSource,
              packageLockSource,
              capacitorConfigSource,
              dependencyPolicySource,
              transitionAuthoritySource,
              packageSwiftSource,
              androidSettingsSource,
              androidBuildSource,
              dependencyAuditSource,
              mainSource,
              productRootSource,
              productAppSource,
              sessionSource,
              nativeTestSource,
            ] = await Promise.all([
              readFile(join(ROOT, 'package.json'), 'utf8'),
              readFile(join(ROOT, 'package-lock.json'), 'utf8'),
              readFile(join(ROOT, 'capacitor.config.json'), 'utf8'),
              readFile(join(ROOT, 'config/dependency-policy.json'), 'utf8'),
              readFile(join(ROOT, 'provenance/b3-package-transition.json'), 'utf8'),
              readFile(join(ROOT, 'ios/App/CapApp-SPM/Package.swift'), 'utf8'),
              readFile(join(ROOT, 'android/capacitor.settings.gradle'), 'utf8'),
              readFile(join(ROOT, 'android/app/capacitor.build.gradle'), 'utf8'),
              readFile(join(ROOT, 'scripts/audit-dependencies.mjs'), 'utf8'),
              readFile(join(ROOT, 'src/main.jsx'), 'utf8'),
              readFile(join(ROOT, 'src/app/ProductRoot.jsx'), 'utf8'),
              readFile(join(ROOT, 'src/app/ProductApp.jsx'), 'utf8'),
              readFile(join(ROOT, 'src/platform/keyboard/ios-dictation-input-session.js'), 'utf8'),
              readFile(join(ROOT, 'ios/App/B3ProofUITests/C5ProductLayoutTests.swift'), 'utf8'),
            ]);

            const packageJson = JSON.parse(packageJsonSource);
            const packageLock = JSON.parse(packageLockSource);
            const capacitorConfig = JSON.parse(capacitorConfigSource);
            const dependencyPolicy = JSON.parse(dependencyPolicySource);
            const transitionAuthority = JSON.parse(transitionAuthoritySource);

            assert.equal(Object.hasOwn(packageJson.dependencies ?? {}, KEYBOARD_PACKAGE), false);
            assert.equal(
              Object.hasOwn(packageLock.packages?.['']?.dependencies ?? {}, KEYBOARD_PACKAGE),
              false,
            );
            assert.equal(Object.hasOwn(packageLock.packages ?? {}, `node_modules/${KEYBOARD_PACKAGE}`), false);
            assert.equal(Object.hasOwn(dependencyPolicy.directDependencies, KEYBOARD_PACKAGE), false);
            assert.equal(Object.hasOwn(dependencyPolicy.npmClassifications, KEYBOARD_PACKAGE), false);
            assert.equal(
              dependencyPolicy.approvedNativePlugins.some(
                ({ packageName }) => packageName === KEYBOARD_PACKAGE,
              ),
              false,
            );
            assert.equal(
              dependencyPolicy.allowedSources.gradleLocalDependencies.includes(
                'project::capacitor-keyboard',
              ),
              false,
            );
            assert.equal(
              Object.hasOwn(transitionAuthority.allowedPackageDependencyAdditions, KEYBOARD_PACKAGE),
              false,
            );

            assert.equal(capacitorConfig.plugins?.Keyboard, undefined);
            assert.doesNotMatch(packageSwiftSource, /CapacitorKeyboard|@capacitor\/keyboard/);
            assert.doesNotMatch(androidSettingsSource, /capacitor-keyboard|@capacitor\/keyboard/);
            assert.doesNotMatch(androidBuildSource, /capacitor-keyboard|@capacitor\/keyboard/);
            assert.doesNotMatch(
              dependencyAuditSource,
              /@capacitor\/keyboard|CapacitorKeyboard|:capacitor-keyboard/,
            );
            assert.equal(
              existsSync(join(ROOT, 'src/platform/keyboard/capacitor-keyboard.js')),
              false,
              'the old global Keyboard helper must not survive as an importable seam',
            );

            assert.doesNotMatch(mainSource, /applyKeyboardChrome|@capacitor\/keyboard/);
            const runtimeSources = await collectRuntimeSources(join(ROOT, 'src'));
            for (const path of runtimeSources) {
              const source = await readFile(path, 'utf8');
              assert.doesNotMatch(
                source,
                /@capacitor\/keyboard|capacitor-keyboard\.js/,
                `${relative(ROOT, path)} must not load the native Keyboard plugin`,
              );
              assert.doesNotMatch(
                source,
                /Keyboard\.(?:setResizeMode|setScroll|setAccessoryBarVisible|show|hide)\s*\(/,
                `${relative(ROOT, path)} must not mutate app-wide keyboard behaviour`,
              );
            }

            assert.doesNotMatch(productRootSource, /installIOSDictationInputSession/);
            assert.match(
              productAppSource,
              /const needsDictationSession = learningState\.screen === 'setup'\s*\|\|\s*learningState\.screen === 'practice';/s,
            );
            assert.match(productAppSource, /return installIOSDictationInputSession\(\);/);
            assert.match(productAppSource, /}, \[needsDictationSession\]\);/);
            assert.match(productAppSource, /id="bank-search-input"[\s\S]*?type="text"/);

            assert.match(
              sessionSource,
              /function park\(\)[\s\S]*?pointerEvents: 'none'[\s\S]*?translate\(-200vw, -200vh\)/,
            );
            assert.doesNotMatch(sessionSource, /Keyboard\.show|keyboardDisplayRequiresUserAction/);

            assert.match(nativeTestSource, /func testProductNicknameFieldRaisesSoftwareKeyboard\(\)/);
            assert.match(nativeTestSource, /nickname\.tap\(\)/);
            assert.match(nativeTestSource, /application\.keyboards\.firstMatch/);
            assert.match(nativeTestSource, /keyboard\.waitForExistence\(timeout: 5\)/);
            assert.match(nativeTestSource, /nickname\.typeText\("Keyboard guard"\)/);
          });
          '''
          keyboard_test = '\n'.join(line[10:] if line.startswith('          ') else line for line in keyboard_test.splitlines()) + '\n'
          write('tests/ios-keyboard-ownership.test.mjs', keyboard_test)

          helper = ROOT / 'src/platform/keyboard/capacitor-keyboard.js'
          helper.unlink(missing_ok=True)

          incident_path = 'docs/solutions/integration-issues/dictation-software-keyboard-ios27-incident.md'
          incident = read(incident_path)
          incident = incident.replace(
              'resolution_type: candidate_fix_pending_device_validation',
              'resolution_type: root_cause_fix_pending_device_validation',
              1,
          )
          old_status = """**Candidate fix implemented; physical-device validation required.** The candidate
          starts from `96d39d60` and deliberately avoids `Keyboard.show()`, WebKit private
          selectors and native method swizzling. It keeps one real text input alive across
          Setup → Round, opens that input from the trusted **Set off** activation, and then
          mirrors it into the existing React-controlled round field.

          The incident remains open until the physical iPhone checklist below passes.
          """
          new_status = """**Root-cause fix implemented; physical-device validation required.** A clean
          uninstall, rebuild and reinstall of PR #53 at `3ce24c3c` reproduced the failure
          across every ordinary text field, not only dictation. Quarantining JavaScript calls
          was insufficient because Capacitor still auto-loaded the linked native Keyboard
          plugin. The correction removes that package from npm, SwiftPM and Android entirely,
          while retaining the Setup → Practice stable-input bridge.

          The standard iOS form accessory bar is intentionally accepted. The incident remains
          open until a clean physical-iPhone build proves ordinary fields and dictation again.
          """
          if incident.count(old_status) != 1:
              raise SystemExit('Expected one incident status block.')
          incident = incident.replace(old_status, new_status, 1)
          old_observation = """3. Startup already calls `applyKeyboardChrome()` →
             `Keyboard.setAccessoryBarVisible({ isVisible: false })` and
             `Keyboard.setResizeMode({ mode: KeyboardResize.None })` so the WebView is
             **not** meant to shrink and walk the painted plate off-screen; inset is owned
             by `keyboard-inset.js` when wired.
          """
          new_observation = """3. Removing every JavaScript caller did not remove the native side effect. When
             `@capacitor/keyboard@8.0.5` remains linked, Capacitor auto-loads it. Its iOS
             `load()` removes keyboard-frame observers from the WKWebView and changes private
             `WKContentView` input methods. On the physical iOS 27 device, that native load
             path coincides with every text field losing the software keyboard.
          """
          if incident.count(old_observation) != 1:
              raise SystemExit('Expected one obsolete startup observation.')
          incident = incident.replace(old_observation, new_observation, 1)
          incident = incident.replace(
              '## Candidate F: persistent iOS input session',
              """## Candidate G: remove the native Keyboard plugin

          The product does not need an API that can summon the keyboard on iOS—the official
          plugin does not provide one. It was linked only to hide the standard form accessory
          bar. That cosmetic benefit is not worth a native plugin which mutates every WKWebView
          text field during load. Candidate G therefore removes the package and all generated
          native references, keeps Capacitor and WebKit defaults intact, and adds a closed
          regression contract that rejects any future npm, SwiftPM, Android or runtime
          reintroduction.

          ## Candidate F: persistent iOS input session (insufficient while the plugin remained linked)""",
              1,
          )
          write(incident_path, incident)
          PY

      - name: Prove Capacitor regeneration is stable
        if: steps.guard.outputs.required == 'true'
        run: |
          git diff -- ios android > /tmp/native-before.diff
          npm run build >/dev/null
          npx --no-install cap sync >/dev/null
          git diff -- ios android > /tmp/native-after.diff
          cmp /tmp/native-before.diff /tmp/native-after.diff

      - name: Regenerate active dependency evidence
        if: steps.guard.outputs.required == 'true'
        run: npm run audit:dependencies -- --write

      - name: Run focused and fast regression gates
        if: steps.guard.outputs.required == 'true'
        run: |
          npm run build:b3-proof-pack
          node --test \
            tests/ios-keyboard-ownership.test.mjs \
            tests/ios-dictation-input-session.test.mjs \
            tests/ios-project-contract.test.mjs \
            tests/android-project-contract.test.mjs \
            tests/app-shell.test.mjs \
            tests/dependency-policy.test.mjs
          npm run test:fast
          npm run lint
          npm run build
          git diff --check

      - name: Show the bounded remaining historical references
        if: steps.guard.outputs.required == 'true'
        run: |
          git grep -n -E '@capacitor/keyboard|CapacitorKeyboard|capacitor-keyboard' -- \
            ':!package-lock.json' ':!reports/b3/dependency-audit.json' ':!THIRD_PARTY_NOTICES.md' || true

      - name: Commit and push the correction
        if: steps.guard.outputs.required == 'true'
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(ios): remove native Keyboard plugin'
          git push origin "HEAD:${HEAD_REF}"
