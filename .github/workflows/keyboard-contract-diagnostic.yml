name: Temporary keyboard contract diagnostic

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: keyboard-contract-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  fast-test-slice:
    name: Fast tests ${{ matrix.group }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        group: [m, n, o, p, q, r]
    steps:
      - name: Fetch the exact pull-request head quietly
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          git init -q .
          git remote add origin "https://github.com/${REPOSITORY}.git"
          git fetch -q --depth=1 origin "$HEAD_SHA"
          git checkout -q --detach FETCH_HEAD
      - name: Install dependencies quietly
        run: npm ci --silent --no-audit --no-fund
      - name: Materialise proof inputs quietly
        run: npm run build:b3-proof-pack >/dev/null
      - name: Run test slice
        env:
          GROUP: ${{ matrix.group }}
        run: |
          files="$({
            find tests -maxdepth 1 -name '*.test.mjs' \
              ! -name '*.slow.test.mjs' \
              ! -name 'native-wrapper-contract.test.mjs' \
              ! -name 'b3-store-backed-live-capture.test.mjs' \
              ! -name 'gateway-workerd-runtime.test.mjs' \
              ! -name 'ci-workflow-contract.test.mjs' \
              -printf '%f\n'
          } | sort | grep -E "^${GROUP}" | sed 's#^#tests/#')"
          if [ -z "$files" ]; then
            echo "No fast tests begin with ${GROUP}."
            exit 0
          fi
          node --test --test-reporter=dot $files
