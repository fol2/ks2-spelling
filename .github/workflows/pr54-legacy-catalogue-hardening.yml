name: PR54 legacy catalogue metadata hardening

on:
  pull_request:
    branches:
      - main
    types: [opened, reopened, synchronize]
    paths:
      - '.github/workflows/pr54-legacy-catalogue-hardening.yml'
      - 'src/app/product-learning-controller.js'
      - 'tests/product-learning-controller.test.mjs'

permissions:
  contents: write

concurrency:
  group: pr54-legacy-catalogue-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  harden:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/words-search-vocabulary-sets-clean'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the exact Words head
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Prove the pull-request head is exact
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$PR_HEAD_SHA"

      - name: Align legacy controller metadata with the Word Bank model
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path_name: str, old: str, new: str) -> None:
              path = Path(path_name)
              source = path.read_text()
              count = source.count(old)
              if count != 1:
                  raise SystemExit(
                      f'{path_name}: expected one replacement, found {count}'
                  )
              path.write_text(source.replace(old, new, 1))

          controller = 'src/app/product-learning-controller.js'
          old_controller = (
              "  const core = catalogue.items.filter(\n"
              "    ({ coverageTier }) => coverageTier === 'statutory-core',\n"
              "  );"
          )
          new_controller = (
              "  const core = catalogue.items.filter(\n"
              "    ({ coverageTier }) =>\n"
              "      coverageTier == null || coverageTier === 'statutory-core',\n"
              "  );"
          )
          replace_once(controller, old_controller, new_controller)

          tests = 'tests/product-learning-controller.test.mjs'
          marker = (
              "test('product learning routes Trouble Drill and SATs Test through "
              "the shared controller', async () => {"
          )
          addition = (
              "test('product learning publishes legacy catalogue rows as core "
              "vocabulary metadata', async () => {\n"
              "  const catalogue = structuredClone(loadStarterSpellingCatalogue());\n"
              "  for (const item of catalogue.items) delete item.coverageTier;\n"
              "  const world = createLearningWorld(\n"
              "    [snapshotForCatalogue(catalogue)],\n"
              "    catalogue,\n"
              "  );\n"
              "  const controller = world.createController();\n"
              "\n"
              "  assert.deepEqual(controller.getState().vocabularySets, [\n"
              "    { id: 'core', label: 'Core', count: 20 },\n"
              "    { id: 'y3-4', label: 'Y3–4', count: 20 },\n"
              "  ]);\n"
              "  assert.ok(\n"
              "    controller.getState().progress.every(\n"
              "      ({ coverageTier }) => coverageTier === null,\n"
              "    ),\n"
              "  );\n"
              "\n"
              "  await controller.dispose();\n"
              "});\n"
              "\n"
          )
          path = Path(tests)
          source = path.read_text()
          if source.count(marker) != 1:
              raise SystemExit('unexpected controller-test insertion marker')
          path.write_text(source.replace(marker, addition + marker, 1))
          PY

      - name: Install and verify the hardened Words feature
        run: |
          npm ci
          node --test \
            tests/product-learning-controller.test.mjs \
            tests/word-bank-model.test.mjs \
            tests/product-app-services.test.mjs \
            tests/app-shell.test.mjs
          npm run test:fast
          npm run lint -- --quiet
          npm run build
          git diff --check

      - name: Commit the durable change and remove one-use machinery
        run: |
          git add \
            src/app/product-learning-controller.js \
            tests/product-learning-controller.test.mjs
          git rm .github/workflows/pr54-legacy-catalogue-hardening.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(words): preserve legacy core metadata'
          git push origin HEAD:agent/words-search-vocabulary-sets-clean
