analyzer:
  errors:
    avoid_dynamic_calls: error
    discarded_futures: error
    missing_required_param: error
    missing_return: error

linter:
  rules:
    - always_declare_return_types
    - avoid_print
    - directives_ordering
    - prefer_final_fields
    - prefer_final_locals
    - require_trailing_commas
    - unawaited_futures
