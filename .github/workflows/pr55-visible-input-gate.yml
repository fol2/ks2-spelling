name: Visible-input keyboard regression gate

on:
  pull_request:
    branches:
      - main
      - agent/words-search-vocabulary-sets-clean
    types: [opened, reopened, synchronize, edited, ready_for_review]
    paths:
      - '.github/workflows/pr55-visible-input-gate.yml'
      - 'android/**'
      - 'config/dependency-policy.json'
      - 'docs/solutions/integration-issues/dictation-software-keyboard-ios27-incident.md'
      - 'ios/**'
      - 'package.json'
      - 'package-lock.json'
      - 'provenance/b3-package-transition.json'
      - 'reports/b3/dependency-audit.json'
      - 'scripts/audit-dependencies.mjs'
      - 'scripts/lib/b3-package-transition-authority.mjs'
      - 'scripts/lib/maven-evidence.mjs'
      - 'src/**'
      - 'tests/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: visible-input-keyboard-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.pull_request.head.ref == 'agent/keyboard-reset-visible-input'
      )
    runs-on: macos-26
    timeout-minutes: 105
    steps:
      - name: Check out the exact reset head
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || 'agent/keyboard-reset-visible-input' }}

      - name: Prove the exact PR base is contained in the reset head
        if: github.event_name == 'pull_request'
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$PR_HEAD_SHA"
          git cat-file -e "$PR_BASE_SHA^{commit}" 2>/dev/null || \
            git fetch --no-tags origin "$PR_BASE_SHA"
          git merge-base --is-ancestor "$PR_BASE_SHA" HEAD

      - name: Record a description-only edit
        if: >-
          github.event_name == 'pull_request' &&
          github.event.action == 'edited' &&
          github.event.changes.base == null
        run: >-
          echo 'PR prose changed, but the exact head and base ancestry are unchanged;
          the previously verified source/native tree does not need rebuilding.'

      - name: Set up Node.js
        if: >-
          github.event_name != 'pull_request' ||
          github.event.action != 'edited' ||
          github.event.changes.base != null
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '24.18.0'
          cache: npm

      - name: Install exact dependencies
        if: >-
          github.event_name != 'pull_request' ||
          github.event.action != 'edited' ||
          github.event.changes.base != null
        run: npm ci

      - name: Verify field ownership and saving-state continuity
        if: >-
          github.event_name != 'pull_request' ||
          github.event.action != 'edited' ||
          github.event.changes.base != null
        run: |
          node --test \
            tests/keyboard-reset-visible-input.test.mjs \
            tests/visible-input-saving-state.test.mjs \
            tests/dependency-policy.test.mjs \
            tests/word-bank-model.test.mjs \
            tests/product-learning-controller.test.mjs \
            tests/product-app-services.test.mjs \
            tests/app-shell.test.mjs
          npm run test:fast
          npm run lint -- --quiet
          npm run build
          git diff --check

      - name: Verify native dependency and iOS composition
        if: >-
          github.event_name != 'pull_request' ||
          github.event.action != 'edited' ||
          github.event.changes.base != null
        run: |
          npm run native:sync:check
          npm run test:ios
          npm run sync:b4-development
          xcodebuild \
            -quiet \
            -project ios/App/App.xcodeproj \
            -scheme B4DevelopmentUITests \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath .native-build/visible-input-gate \
            CODE_SIGNING_ALLOWED=NO \
            build-for-testing
