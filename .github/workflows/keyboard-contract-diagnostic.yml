name: Temporary keyboard contract diagnostic

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: keyboard-contract-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  maven-evidence:
    name: Maven evidence test in isolation
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Fetch the exact pull-request head quietly
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          git init -q .
          git remote add origin "https://github.com/${REPOSITORY}.git"
          git fetch -q --depth=1 origin "$HEAD_SHA"
          git checkout -q --detach FETCH_HEAD
      - name: Install dependencies quietly
        run: npm ci --silent --no-audit --no-fund
      - name: Run Maven evidence test by itself
        run: node --test tests/maven-licence-evidence.test.mjs
