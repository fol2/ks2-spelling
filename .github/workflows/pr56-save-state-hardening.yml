name: PR56 save-state hardening

on:
  push:
    branches:
      - spike/flutter-flame-vertical-slice

permissions:
  contents: write

concurrency:
  group: pr56-save-state-hardening-${{ github.ref }}
  cancel-in-progress: false

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out the exact spike branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          ref: spike/flutter-flame-vertical-slice

      - name: Guard editing during durable saves and validate persisted rows
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path_name: str, old: str, new: str) -> None:
              path = Path(path_name)
              source = path.read_text()
              count = source.count(old)
              if count != 1:
                  raise SystemExit(
                      f'{path_name}: expected one replacement, found {count}'
                  )
              path.write_text(source.replace(old, new, 1))

          app = 'spikes/flutter_ks2_spelling/lib/spelling_spike_app.dart'
          replace_once(
              app,
              "import 'package:flame/game.dart';\nimport 'package:flutter/material.dart';",
              "import 'package:flame/game.dart';\nimport 'package:flutter/material.dart';\nimport 'package:flutter/services.dart';",
          )
          replace_once(
              app,
              "  bool _loading = true;\n  bool _loadInFlight = false;\n  bool _busy = false;",
              "  bool _loading = true;\n  bool _loadInFlight = false;\n  bool _playing = false;\n  bool _saving = false;\n\n  bool get _busy => _playing || _saving;",
          )
          replace_once(
              app,
              '''  Future<void> _playPrompt() async {
    setState(() {
      _busy = true;
      _feedback = 'Playing the spelling prompt.';
    });
    try {
      await widget.audio.play();
      if (!mounted) {
        return;
      }
      setState(() {
        _feedback = 'Type the word you heard.';
      });
    } on Object {
      if (!mounted) {
        return;
      }
      setState(() {
        _feedback = 'The bundled prompt could not play.';
      });
    } finally {
      if (mounted) {
        setState(() {
          _busy = false;
        });
      }
    }
  }''',
              '''  Future<void> _playPrompt() async {
    if (_busy) {
      return;
    }
    setState(() {
      _playing = true;
      _feedback = 'Playing the spelling prompt.';
    });
    try {
      await widget.audio.play();
      if (!mounted) {
        return;
      }
      setState(() {
        _feedback = 'Type the word you heard.';
      });
    } on Object {
      if (!mounted) {
        return;
      }
      setState(() {
        _feedback = 'The bundled prompt could not play.';
      });
    } finally {
      if (mounted) {
        setState(() {
          _playing = false;
        });
      }
    }
  }''',
          )
          replace_once(
              app,
              '''  Future<void> _submit() async {
    final String answer = _answerController.text.trim().toLowerCase();
    if (answer.isEmpty || _busy) {
      setState(() {
        _feedback = answer.isEmpty
            ? 'Type a spelling before submitting.'
            : _feedback;
      });
      return;
    }

    final bool correct = answer == target;
    final bool alreadyEvolved = _snapshot?.evolved ?? false;
    setState(() {
      _busy = true;
    });
    try {
      final AttemptSnapshot snapshot = await widget.repository.recordAnswer(
        correct: correct,
      );
      if (!mounted) {
        return;
      }
      setState(() {
        _snapshot = snapshot;
        _feedback = correct
            ? alreadyEvolved
                ? 'Correct. Your companion remains safely evolved.'
                : 'Correct. The egg has evolved into a companion.'
            : 'Not yet. Listen again and try once more.';
        if (correct) {
          _answerController.clear();
        } else {
          _answerController.selection = TextSelection(
            baseOffset: 0,
            extentOffset: _answerController.text.length,
          );
        }
      });
    } on Object {
      if (!mounted) {
        return;
      }
      setState(() {
        _feedback = 'The answer could not be saved locally.';
      });
    } finally {
      if (mounted) {
        setState(() {
          _busy = false;
        });
      }
    }
  }''',
              '''  Future<void> _submit() async {
    if (_busy) {
      return;
    }
    final String answer = _answerController.text.trim().toLowerCase();
    if (answer.isEmpty) {
      setState(() {
        _feedback = 'Type a spelling before submitting.';
      });
      return;
    }

    final bool correct = answer == target;
    final bool alreadyEvolved = _snapshot?.evolved ?? false;
    setState(() {
      _saving = true;
      _feedback = 'Saving your answer locally.';
    });
    try {
      final AttemptSnapshot snapshot = await widget.repository.recordAnswer(
        correct: correct,
      );
      if (!mounted) {
        return;
      }
      setState(() {
        _snapshot = snapshot;
        _feedback = correct
            ? alreadyEvolved
                ? 'Correct. Your companion remains safely evolved.'
                : 'Correct. The egg has evolved into a companion.'
            : 'Not yet. Listen again and try once more.';
        if (correct) {
          _answerController.clear();
        } else {
          _answerController.selection = TextSelection(
            baseOffset: 0,
            extentOffset: _answerController.text.length,
          );
        }
      });
    } on Object {
      if (!mounted) {
        return;
      }
      setState(() {
        _feedback = 'The answer could not be saved locally.';
      });
    } finally {
      if (mounted) {
        setState(() {
          _saving = false;
        });
      }
    }
  }''',
          )
          replace_once(
              app,
              '''                                enableIMEPersonalizedLearning: false,
                                autofillHints: const <String>[],
                                smartDashesType: SmartDashesType.disabled,''',
              '''                                enableIMEPersonalizedLearning: false,
                                autofillHints: const <String>[],
                                inputFormatters: <TextInputFormatter>[
                                  TextInputFormatter.withFunction(
                                    (
                                      TextEditingValue oldValue,
                                      TextEditingValue newValue,
                                    ) => _saving ? oldValue : newValue,
                                  ),
                                ],
                                smartDashesType: SmartDashesType.disabled,''',
          )

          repository = 'spikes/flutter_ks2_spelling/lib/attempt_repository.dart'
          replace_once(
              repository,
              '''  AttemptSnapshot _snapshotFromRow(Map<String, Object?> row) {
    final int attempts = row['attempts']! as int;
    final int correctCount = row['correct_count']! as int;
    if (attempts < 0 || correctCount < 0 || correctCount > attempts) {
      throw StateError('The bounded learner counters are invalid.');
    }
    return AttemptSnapshot(
      learnerId: row['learner_id']! as String,
      nickname: row['nickname']! as String,
      attempts: attempts,
      correctCount: correctCount,
      evolved: (row['evolved']! as int) == 1,
    );
  }''',
              '''  AttemptSnapshot _snapshotFromRow(Map<String, Object?> row) {
    final Object? storedLearnerId = row['learner_id'];
    final Object? storedNickname = row['nickname'];
    final Object? storedAttempts = row['attempts'];
    final Object? storedCorrectCount = row['correct_count'];
    final Object? storedEvolved = row['evolved'];

    if (storedLearnerId != learnerId) {
      throw StateError('The bounded learner identity is invalid.');
    }
    if (storedNickname is! String || storedNickname.trim().isEmpty) {
      throw StateError('The bounded learner nickname is invalid.');
    }
    if (
      storedAttempts is! int
      || storedCorrectCount is! int
      || storedAttempts < 0
      || storedCorrectCount < 0
      || storedCorrectCount > storedAttempts
    ) {
      throw StateError('The bounded learner counters are invalid.');
    }
    if (storedEvolved is! int || (storedEvolved != 0 && storedEvolved != 1)) {
      throw StateError('The bounded learner evolution flag is invalid.');
    }
    return AttemptSnapshot(
      learnerId: storedLearnerId,
      nickname: storedNickname,
      attempts: storedAttempts,
      correctCount: storedCorrectCount,
      evolved: storedEvolved == 1,
    );
  }''',
          )

          widget_test = Path(
              'spikes/flutter_ks2_spelling/test/spelling_spike_app_test.dart'
          )
          source = widget_test.read_text()
          if not source.startswith("import 'package:flame/game.dart';"):
              raise SystemExit('unexpected widget-test import header')
          source = "import 'dart:async';\n\n" + source

          marker = '''final class FailingCleanupAttemptStore extends MemoryAttemptStore {'''
          helpers = '''final class GatedAttemptStore implements AttemptStore {
  GatedAttemptStore(this.delegate);

  final MemoryAttemptStore delegate;
  final Completer<void> recordStarted = Completer<void>();
  final Completer<void> allowRecord = Completer<void>();

  @override
  Future<AttemptSnapshot> read() => delegate.read();

  @override
  Future<AttemptSnapshot> recordAnswer({required bool correct}) async {
    if (!recordStarted.isCompleted) {
      recordStarted.complete();
    }
    await allowRecord.future;
    return delegate.recordAnswer(correct: correct);
  }

  @override
  Future<void> close() => delegate.close();
}

final class FailingRecordAttemptStore implements AttemptStore {
  FailingRecordAttemptStore(this.delegate);

  final MemoryAttemptStore delegate;

  @override
  Future<AttemptSnapshot> read() => delegate.read();

  @override
  Future<AttemptSnapshot> recordAnswer({required bool correct}) {
    return Future<AttemptSnapshot>.error(
      StateError('simulated answer-save failure'),
    );
  }

  @override
  Future<void> close() => delegate.close();
}

'''
          if source.count(marker) != 1:
              raise SystemExit('unexpected widget-test helper marker')
          source = source.replace(marker, helpers + marker, 1)

          old = '''  expect(input.enableIMEPersonalizedLearning, isFalse);
  expect(input.autofillHints, isEmpty);
  return inputFinder;'''
          new = '''  expect(input.enableIMEPersonalizedLearning, isFalse);
  expect(input.autofillHints, isEmpty);
  expect(input.readOnly, isFalse);
  expect(input.inputFormatters, hasLength(1));
  return inputFinder;'''
          if source.count(old) != 1:
              raise SystemExit('unexpected visible-field assertion marker')
          source = source.replace(old, new, 1)

          test_marker = '''  testWidgets('a startup failure is visible, preserves data wording and can retry', ('''
          new_tests = '''  testWidgets(
    'answer edits are blocked only while the local save is in flight',
    (WidgetTester tester) async {
      final MemoryAttemptStore delegate = MemoryAttemptStore();
      final GatedAttemptStore repository = GatedAttemptStore(delegate);
      final RecordingPromptAudio audio = RecordingPromptAudio();
      final Finder inputFinder = await mountVisibleField(
        tester,
        repository,
        audio,
      );

      await tester.enterText(inputFinder, 'accident');
      await tester.tap(find.byKey(const Key('submit-button')));
      await repository.recordStarted.future;
      await tester.pump();

      final TextField savingField = tester.widget<TextField>(inputFinder);
      expect(savingField.readOnly, isFalse);
      expect(
        tester.widget<FilledButton>(find.byKey(const Key('submit-button'))).onPressed,
        isNull,
      );
      final TextInputFormatter savingFormatter =
          savingField.inputFormatters!.single;
      const TextEditingValue accepted = TextEditingValue(
        text: 'accident',
        selection: TextSelection.collapsed(offset: 8),
      );
      const TextEditingValue attempted = TextEditingValue(
        text: 'accidental',
        selection: TextSelection.collapsed(offset: 10),
      );
      expect(
        savingFormatter.formatEditUpdate(accepted, attempted),
        accepted,
        reason: 'the active input connection stays open while edits are rejected',
      );
      expect(
        tester.widget<TextField>(inputFinder).controller?.text,
        'accident',
      );

      repository.allowRecord.complete();
      await pumpUntilFound(
        tester,
        find.text('Correct. The egg has evolved into a companion.'),
      );
      final TextField finishedField = tester.widget<TextField>(inputFinder);
      expect(finishedField.readOnly, isFalse);
      expect(
        finishedField.inputFormatters!.single.formatEditUpdate(
          accepted,
          attempted,
        ),
        attempted,
      );
      expect(finishedField.controller?.text, isEmpty);

      await unmountAndVerifyCleanup(tester, delegate, audio);
    },
  );

  testWidgets('a failed local save unlocks the field and preserves the answer', (
    WidgetTester tester,
  ) async {
    final MemoryAttemptStore delegate = MemoryAttemptStore();
    final FailingRecordAttemptStore repository =
        FailingRecordAttemptStore(delegate);
    final RecordingPromptAudio audio = RecordingPromptAudio();
    final Finder inputFinder = await mountVisibleField(
      tester,
      repository,
      audio,
    );

    await tester.enterText(inputFinder, 'accident');
    await tester.tap(find.byKey(const Key('submit-button')));
    await pumpUntilFound(
      tester,
      find.text('The answer could not be saved locally.'),
    );

    final TextField field = tester.widget<TextField>(inputFinder);
    expect(field.readOnly, isFalse);
    expect(field.controller?.text, 'accident');
    const TextEditingValue oldValue = TextEditingValue(text: 'accident');
    const TextEditingValue newValue = TextEditingValue(text: 'accidents');
    expect(
      field.inputFormatters!.single.formatEditUpdate(oldValue, newValue),
      newValue,
    );
    expect(
      tester.widget<FilledButton>(find.byKey(const Key('submit-button'))).onPressed,
      isNotNull,
    );

    await unmountAndVerifyCleanup(tester, delegate, audio);
  });

'''
          if source.count(test_marker) != 1:
              raise SystemExit('unexpected widget-test insertion marker')
          source = source.replace(test_marker, new_tests + test_marker, 1)
          widget_test.write_text(source)

          repository_test = Path(
              'spikes/flutter_ks2_spelling/test/attempt_repository_test.dart'
          )
          source = repository_test.read_text()
          final_marker = '\n}\n'
          if not source.endswith(final_marker):
              raise SystemExit('unexpected repository-test ending')
          corruption_test = '''

  test('malformed persisted learner identity is rejected at the read boundary', () async {
    final Directory directory = await Directory.systemTemp.createTemp(
      'ks2-spelling-flutter-corrupt-',
    );
    final String databasePath = paths.join(directory.path, 'learner.sqlite');
    addTearDown(() async {
      await directory.delete(recursive: true);
    });

    final AttemptRepository seeded = AttemptRepository(
      databaseFactory: databaseFactoryFfi,
      databasePath: databasePath,
    );
    await seeded.read();
    await seeded.close();

    final Database raw = await databaseFactoryFfi.openDatabase(databasePath);
    final int changed = await raw.update(
      'learner_state',
      <String, Object>{'nickname': '   '},
      where: 'learner_id = ?',
      whereArgs: <Object>[AttemptRepository.learnerId],
    );
    expect(changed, 1);
    await raw.close();

    final AttemptRepository corrupted = AttemptRepository(
      databaseFactory: databaseFactoryFfi,
      databasePath: databasePath,
    );
    await expectLater(corrupted.read(), throwsStateError);
    await corrupted.close();
  });'''
          source = source[:-len(final_marker)] + corruption_test + final_marker
          repository_test.write_text(source)
          PY

      - name: Install Flutter test prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            libsqlite3-dev
          git clone --depth 1 --branch 3.44.7 \
            https://github.com/flutter/flutter.git \
            "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/flutter/bin/flutter" config --no-analytics
          "$RUNNER_TEMP/flutter/bin/flutter" precache --linux

      - name: Analyse and test the hardened spike
        working-directory: spikes/flutter_ks2_spelling
        run: |
          flutter pub get --enforce-lockfile
          dart format --output=none --set-exit-if-changed lib test
          flutter analyze
          flutter test

      - name: Commit the hardened source and remove one-use machinery
        run: |
          git diff --check
          git add \
            spikes/flutter_ks2_spelling/lib/attempt_repository.dart \
            spikes/flutter_ks2_spelling/lib/spelling_spike_app.dart \
            spikes/flutter_ks2_spelling/test/attempt_repository_test.dart \
            spikes/flutter_ks2_spelling/test/spelling_spike_app_test.dart
          git rm .github/workflows/pr56-save-state-hardening.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(spike): guard input across durable saves'
          git push origin HEAD:spike/flutter-flame-vertical-slice
