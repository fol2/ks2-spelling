name: Stack visible-input reset on hardened Words

on:
  pull_request:
    branches:
      - agent/words-search-vocabulary-sets-clean
    types: [opened, reopened, synchronize, edited]

permissions:
  contents: write

concurrency:
  group: stack-pr55-on-words-${{ github.event.pull_request.number }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  stack-and-verify:
    if: >-
      github.event.pull_request.head.ref == 'agent/keyboard-reset-visible-input' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'github-actions[bot]'
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - name: Check out the hardened Words base
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          ref: agent/words-search-vocabulary-sets-clean

      - name: Normalize the reviewed Word Bank JSX
        id: normalize
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/app/ProductApp.jsx')
          source = path.read_text()
          pairs = [
              (
                  """  const bank = useMemo(
            () => buildWordBank({
              progress,
              filter,
              vocabSet,
              vocabularySets,
              query,
            }),
            [progress, filter, vocabSet, vocabularySets, query],
          );""".replace('            ()', '  ()').replace('              progress', '    progress').replace('              filter', '    filter').replace('              vocabSet', '    vocabSet').replace('              vocabularySets', '    vocabularySets').replace('              query', '    query').replace('            }),', '  }),').replace('            [progress', '  [progress').replace('          );', ');'),
                  """  const bank = useMemo(
    () => buildWordBank({
      progress,
      filter,
      vocabSet,
      vocabularySets,
      query,
    }),
    [progress, filter, vocabSet, vocabularySets, query],
  );""",
              ),
              (
                  """            <span
            id="bank-result-count"
            className="figure"
            role="status"
            aria-live="polite"
            aria-atomic="true"
          >
            {bank.countLabel}
          </span>""",
                  """            <span
              id="bank-result-count"
              className="figure"
              role="status"
              aria-live="polite"
              aria-atomic="true"
            >
              {bank.countLabel}
            </span>""",
              ),
              (
                  """              enterKeyHint="search"
            maxLength={64}
            aria-describedby="bank-result-count"
            onChange={(event) => setQuery(event.target.value)}
            onKeyDown={(event) => {
              if (event.key === 'Escape' && query) {
                event.preventDefault();
                setQuery('');
              }
            }}
            />""",
                  """              enterKeyHint="search"
              maxLength={64}
              aria-describedby="bank-result-count"
              onChange={(event) => setQuery(event.target.value)}
              onKeyDown={(event) => {
                if (event.key === 'Escape' && query) {
                  event.preventDefault();
                  setQuery('');
                }
              }}
            />""",
              ),
              (
                  """                aria-pressed={option.selected}
              aria-label={`${option.label}, ${option.count} ${option.count === 1 ? 'word' : 'words'}`}
              onClick={() => setVocabSet(option.id)}""",
                  """                aria-pressed={option.selected}
                aria-label={`${option.label}, ${option.count} ${option.count === 1 ? 'word' : 'words'}`}
                onClick={() => setVocabSet(option.id)}""",
              ),
              (
                  """                aria-pressed={option.selected}
              aria-label={`${option.label}, ${option.count} ${option.count === 1 ? 'word' : 'words'}`}
              onClick={() => setFilter(option.id)}""",
                  """                aria-pressed={option.selected}
                aria-label={`${option.label}, ${option.count} ${option.count === 1 ? 'word' : 'words'}`}
                onClick={() => setFilter(option.id)}""",
              ),
              (
                  """      <WordBankScreen
      progress={learningState.progress}
      vocabularySets={learningState.vocabularySets}
      onScreen={showScreen}
        onStart={() => showScreen('setup')}""",
                  """      <WordBankScreen
        progress={learningState.progress}
        vocabularySets={learningState.vocabularySets}
        onScreen={showScreen}
        onStart={() => showScreen('setup')}""",
              ),
          ]
          changed = False
          for bad, good in pairs:
              bad_count = source.count(bad)
              good_count = source.count(good)
              if bad_count == 1 and good_count == 0:
                  source = source.replace(bad, good, 1)
                  changed = True
              elif bad_count == 0 and good_count == 1:
                  pass
              else:
                  raise SystemExit(
                      f'unexpected reviewed JSX topology: bad={bad_count}, good={good_count}'
                  )
          if changed:
              path.write_text(source)
          PY
          if git diff --quiet -- src/app/ProductApp.jsx; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "24.18.0"
          cache: npm

      - name: Verify and publish normalized Words source
        if: steps.normalize.outputs.changed == 'true'
        run: |
          npm ci
          node --test \
            tests/word-bank-model.test.mjs \
            tests/product-learning-controller.test.mjs \
            tests/product-app-services.test.mjs \
            tests/app-shell.test.mjs
          npm run lint -- --quiet
          npm run build
          git diff --check
          test "$(git diff --name-only)" = "src/app/ProductApp.jsx"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/ProductApp.jsx
          git commit -m "style(words): normalize the hardened Word Bank"
          git push origin HEAD:agent/words-search-vocabulary-sets-clean

      - name: Stop after advancing the base branch
        if: steps.normalize.outputs.changed == 'true'
        run: |
          echo "The base branch advanced. GitHub will rerun the stack against its new exact head."
          exit 0

      - name: Merge the exact Words base into the keyboard reset
        if: steps.normalize.outputs.changed == 'false'
        run: |
          git fetch --no-tags origin \
            refs/heads/agent/keyboard-reset-visible-input:refs/remotes/origin/agent/keyboard-reset-visible-input \
            refs/heads/agent/words-search-vocabulary-sets-clean:refs/remotes/origin/agent/words-search-vocabulary-sets-clean
          git checkout -B agent/keyboard-reset-visible-input origin/agent/keyboard-reset-visible-input
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          set +e
          git merge --no-commit --no-ff origin/agent/words-search-vocabulary-sets-clean
          merge_status=$?
          set -e
          if [ "$merge_status" -ne 0 ]; then
            conflicts="$(git diff --name-only --diff-filter=U)"
            test "$conflicts" = "tests/app-shell.test.mjs"
            git checkout --theirs tests/app-shell.test.mjs
          fi

          python3 - <<'PY'
          from pathlib import Path

          path = Path('tests/app-shell.test.mjs')
          source = path.read_text()
          retired = "  '@capacitor/keyboard': '8.0.5',\n"
          count = source.count(retired)
          if count == 1:
              source = source.replace(retired, '', 1)
          elif count != 0:
              raise SystemExit(f'unexpected Keyboard version entries: {count}')
          path.write_text(source)
          PY
          git add -A
          git diff --cached --check
          git commit -m "merge: stack visible-input reset on hardened Words"

      - name: Verify the combined web and native product
        if: steps.normalize.outputs.changed == 'false'
        run: |
          npm ci
          node --test \
            tests/keyboard-reset-visible-input.test.mjs \
            tests/dependency-policy.test.mjs \
            tests/word-bank-model.test.mjs \
            tests/product-learning-controller.test.mjs \
            tests/product-app-services.test.mjs \
            tests/app-shell.test.mjs
          npm run test:fast
          npm run lint -- --quiet
          npm run build
          npm run native:sync:check
          npm run test:ios
          npm run sync:b4-development
          xcodebuild \
            -quiet \
            -project ios/App/App.xcodeproj \
            -scheme B4DevelopmentUITests \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath .native-build/stack-pr55 \
            CODE_SIGNING_ALLOWED=NO \
            build-for-testing

      - name: Publish the tested stack
        if: steps.normalize.outputs.changed == 'false'
        run: git push origin HEAD:agent/keyboard-reset-visible-input

      - name: Remove this one-use workflow from the Words base
        if: steps.normalize.outputs.changed == 'false'
        run: |
          git checkout -B agent/words-search-vocabulary-sets-clean origin/agent/words-search-vocabulary-sets-clean
          git rm .github/workflows/stack-pr55-on-words.yml
          git commit -m "ci: retire the PR54 to PR55 stack gate"
          git push origin HEAD:agent/words-search-vocabulary-sets-clean

      - name: Merge workflow cleanup into the reset branch
        if: steps.normalize.outputs.changed == 'false'
        run: |
          git fetch --no-tags origin \
            refs/heads/agent/words-search-vocabulary-sets-clean:refs/remotes/origin/agent/words-search-vocabulary-sets-clean
          git checkout -B agent/keyboard-reset-visible-input origin/agent/keyboard-reset-visible-input
          git merge --no-edit origin/agent/words-search-vocabulary-sets-clean
          git push origin HEAD:agent/keyboard-reset-visible-input
