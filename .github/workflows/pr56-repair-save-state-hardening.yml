name: Repair PR56 save-state hardening gate

on:
  push:
    branches:
      - spike/flutter-flame-vertical-slice

permissions:
  contents: write

concurrency:
  group: pr56-repair-save-state-hardening-${{ github.ref }}
  cancel-in-progress: false

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the exact spike branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          ref: spike/flutter-flame-vertical-slice

      - name: Make the one-use hardening run format before checking
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/pr56-save-state-hardening.yml')
          source = path.read_text()
          replacements = {
              '  cancel-in-progress: false\n': '  cancel-in-progress: true\n',
              "    if: github.actor != 'github-actions[bot]'\n": (
                  "    if: >-\n"
                  "      github.actor != 'github-actions[bot]' ||\n"
                  "      github.event.head_commit.message == 'ci: repair PR56 save-state hardening'\n"
              ),
              '          dart format --output=none --set-exit-if-changed lib test\n': (
                  '          dart format lib test\n'
              ),
          }
          for old, new in replacements.items():
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'expected one {old!r}, found {count}')
              source = source.replace(old, new, 1)
          path.write_text(source)
          PY

      - name: Commit the repair and remove this helper
        run: |
          git add .github/workflows/pr56-save-state-hardening.yml
          git rm .github/workflows/pr56-repair-save-state-hardening.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'ci: repair PR56 save-state hardening'
          git push origin HEAD:spike/flutter-flame-vertical-slice
