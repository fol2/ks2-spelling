name: Flutter and Flame vertical-slice proof

on:
  pull_request:
    branches:
      - main
    types: [opened, reopened, synchronize]

permissions:
  contents: read

concurrency:
  group: flutter-flame-spike-${{ github.event.pull_request.number }}-${{ github.actor }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  linux-android-and-freeze:
    if: >-
      github.event.pull_request.head.ref == 'spike/flutter-flame-vertical-slice' &&
      github.actor != 'github-actions[bot]'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out the spike branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          ref: spike/flutter-flame-vertical-slice

      - name: Install Linux build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang \
            cmake \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            libgtk-3-dev \
            liblzma-dev \
            libsqlite3-dev \
            ninja-build \
            pkg-config

      - name: Install Flutter 3.44.7
        run: |
          git clone --depth 1 --branch 3.44.7 \
            https://github.com/flutter/flutter.git \
            "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/flutter/bin/flutter" config --no-analytics
          "$RUNNER_TEMP/flutter/bin/flutter" precache --android --linux

      - name: Generate identical native shells and copy the frozen audio asset
        run: bash scripts/scaffold-flutter-spike.sh

      - name: Resolve, analyse and test
        working-directory: spikes/flutter_ks2_spelling
        run: |
          flutter pub get
          flutter analyze
          flutter test

      - name: Build Android and Linux debug applications
        working-directory: spikes/flutter_ks2_spelling
        run: |
          flutter build apk --debug
          flutter build linux --debug

      - name: Commit the exact generated shells and lockfile
        run: |
          git diff --check
          git add spikes/flutter_ks2_spelling
          if git diff --cached --quiet; then
            echo "Generated Flutter bytes are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build(spike): freeze generated Flutter platform shells"
          git push origin HEAD:spike/flutter-flame-vertical-slice

  apple:
    if: >-
      github.event.pull_request.head.ref == 'spike/flutter-flame-vertical-slice' &&
      github.actor != 'github-actions[bot]'
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - name: Check out the spike branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          ref: spike/flutter-flame-vertical-slice

      - name: Install Flutter 3.44.7
        run: |
          git clone --depth 1 --branch 3.44.7 \
            https://github.com/flutter/flutter.git \
            "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/flutter/bin/flutter" config --no-analytics
          "$RUNNER_TEMP/flutter/bin/flutter" precache --ios --macos

      - name: Generate identical native shells and copy the frozen audio asset
        run: bash scripts/scaffold-flutter-spike.sh

      - name: Resolve, analyse and test
        working-directory: spikes/flutter_ks2_spelling
        run: |
          flutter pub get
          flutter analyze
          flutter test

      - name: Build unsigned Apple applications
        working-directory: spikes/flutter_ks2_spelling
        run: |
          flutter build macos --debug
          flutter build ios --simulator --debug --no-codesign

  windows:
    if: >-
      github.event.pull_request.head.ref == 'spike/flutter-flame-vertical-slice' &&
      github.actor != 'github-actions[bot]'
    runs-on: windows-2025
    timeout-minutes: 120
    steps:
      - name: Check out the spike branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          ref: spike/flutter-flame-vertical-slice

      - name: Install Flutter 3.44.7
        run: |
          temp_root="$(cygpath -u "$RUNNER_TEMP")"
          git clone --depth 1 --branch 3.44.7 \
            https://github.com/flutter/flutter.git \
            "$temp_root/flutter"
          echo "$temp_root/flutter/bin" >> "$GITHUB_PATH"
          "$temp_root/flutter/bin/flutter" config --no-analytics
          "$temp_root/flutter/bin/flutter" precache --windows

      - name: Generate identical native shells and copy the frozen audio asset
        run: bash scripts/scaffold-flutter-spike.sh

      - name: Resolve, analyse and test
        working-directory: spikes/flutter_ks2_spelling
        run: |
          flutter pub get
          flutter analyze
          flutter test

      - name: Build the Windows debug application
        working-directory: spikes/flutter_ks2_spelling
        run: flutter build windows --debug
