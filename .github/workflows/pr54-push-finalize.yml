name: PR54 exact finalization

on:
  push:
    branches:
      - agent/words-search-vocabulary-sets-clean

permissions:
  contents: write

concurrency:
  group: pr54-exact-finalization-${{ github.ref }}
  cancel-in-progress: false

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out the exact Words branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          ref: agent/words-search-vocabulary-sets-clean

      - name: Apply the reviewed final patch
        run: python3 scripts/pr54-final-hardening.py

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "24.18.0"
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Verify focused and complete product behaviour
        run: |
          node --test \
            tests/word-bank-model.test.mjs \
            tests/product-learning-controller.test.mjs \
            tests/product-app-services.test.mjs \
            tests/app-shell.test.mjs
          npm run test:fast
          npm run lint -- --quiet
          npm run build
          git diff --check

      - name: Commit only durable product and test files
        run: |
          git add \
            src/app/ProductApp.jsx \
            src/app/product-learning-controller.js \
            tests/product-learning-controller.test.mjs \
            tests/app-shell.test.mjs
          git rm \
            .github/workflows/pr54-final-hardening.yml \
            .github/workflows/pr54-push-finalize.yml \
            scripts/pr54-final-hardening.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "refactor(words): finish catalogue-aware Word Bank"
          git push origin HEAD:agent/words-search-vocabulary-sets-clean
