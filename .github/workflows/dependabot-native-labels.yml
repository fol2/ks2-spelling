name: Label native npm Dependabot proposals

# Dependabot labels are per ecosystem. The npm entry therefore cannot attach
# native-dependency-review only to Capacitor packages. This workflow is the
# smallest in-repo compensation. Title matching happens in the job if, so a
# Dependabot-controlled title never reaches the shell. The run step is a
# constant label command. It does not merge, rebase, ignore or close pull
# requests, and it does not create labels.

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  pull-requests: write

concurrency:
  group: dependabot-native-labels-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  label:
    name: Label Capacitor npm proposals
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]'
      && (
        contains(github.event.pull_request.title, '@capacitor/')
        || contains(github.event.pull_request.title, '@capacitor-community/')
      )
    runs-on: ubuntu-24.04
    steps:
      # No checkout: this job never reads the tree.
      - name: Apply native-dependency-review
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh pr edit "$PR_NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            --add-label native-dependency-review
