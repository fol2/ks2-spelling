name: Keyboard reset dependency regeneration

on:
  push:
    branches:
      - agent/keyboard-reset-visible-input

permissions:
  contents: write

concurrency:
  group: keyboard-reset-regenerate-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - name: Check out reset branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          ref: agent/keyboard-reset-visible-input

      - name: Reuse the reviewed native Keyboard removal bytes
        run: |
          git fetch --no-tags origin \
            refs/heads/agent/pr53-word-bank-sets-search:refs/remotes/origin/agent/pr53-word-bank-sets-search
          git checkout e14189b74897cf1696373e8e42d728674a283463 -- \
            THIRD_PARTY_NOTICES.md \
            android/app/capacitor.build.gradle \
            android/capacitor.settings.gradle \
            config/dependency-policy.json \
            ios/App/CapApp-SPM/Package.swift \
            package-lock.json \
            package.json \
            provenance/b3-package-transition.json \
            reports/b3/dependency-audit.json \
            scripts/audit-dependencies.mjs \
            scripts/lib/b3-package-transition-authority.mjs \
            scripts/lib/maven-evidence.mjs \
            tests/dependency-policy.test.mjs

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "24.18.0"
          cache: npm

      - name: Install exact dependencies without the Keyboard plugin
        run: npm ci

      - name: Verify the regenerated native plugin graphs
        run: npm run native:sync:check

      - name: Run focused and fast contracts before native evidence
        run: |
          node --test tests/keyboard-reset-visible-input.test.mjs tests/dependency-policy.test.mjs
          npm run test:fast

      - name: Build the unsigned iOS application used by the dependency audit
        run: npm run test:ios

      - name: Regenerate resolved dependency evidence
        run: npm run audit:dependencies -- --write

      - name: Recheck generated closure
        run: |
          npm run native:sync:check
          node --test tests/keyboard-reset-visible-input.test.mjs tests/dependency-policy.test.mjs
          npm run lint -- --quiet

      - name: Commit the verified dependency removal
        run: |
          git add \
            THIRD_PARTY_NOTICES.md \
            android/app/capacitor.build.gradle \
            android/capacitor.settings.gradle \
            config/dependency-policy.json \
            ios/App/CapApp-SPM/Package.swift \
            package-lock.json \
            package.json \
            provenance/b3-package-transition.json \
            reports/b3/dependency-audit.json \
            scripts/audit-dependencies.mjs \
            scripts/lib/b3-package-transition-authority.mjs \
            scripts/lib/maven-evidence.mjs \
            tests/dependency-policy.test.mjs
          if git diff --cached --quiet; then
            echo "Dependency closure is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(ios): remove the native keyboard plugin"
          git push origin HEAD:agent/keyboard-reset-visible-input
