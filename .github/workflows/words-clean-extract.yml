name: Clean Words extraction

on:
  pull_request:
    branches:
      - main
    types: [opened, reopened, synchronize]

permissions:
  contents: write

concurrency:
  group: words-clean-extract-${{ github.event.pull_request.number }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  extract:
    if: >-
      github.event.pull_request.head.ref == 'agent/words-search-vocabulary-sets-clean' &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out clean Words branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          ref: agent/words-search-vocabulary-sets-clean

      - name: Reuse the reviewed Words product bytes
        run: |
          git fetch --no-tags origin \
            refs/heads/agent/pr53-word-bank-sets-search:refs/remotes/origin/agent/pr53-word-bank-sets-search
          git checkout e14189b74897cf1696373e8e42d728674a283463 -- \
            src/app/ProductApp.jsx \
            src/app/app.css \
            src/app/product-learning-controller.js \
            tests/app-shell.test.mjs \
            tests/product-app-services.test.mjs \
            tests/product-learning-controller.test.mjs \
            tests/word-bank-model.test.mjs

      - name: Strip every keyboard-only part from the extracted files
        run: |
          python3 - <<'PY'
          from pathlib import Path

          product = Path('src/app/ProductApp.jsx')
          source = product.read_text()
          for retired_import in (
              "import { Capacitor } from '@capacitor/core';\n",
              "import { installIOSDictationInputSession } from '../platform/keyboard/ios-dictation-input-session.js';\n",
          ):
              if source.count(retired_import) != 1:
                  raise SystemExit(f'missing expected keyboard import: {retired_import.strip()}')
              source = source.replace(retired_import, '', 1)

          session_start = source.find('  // Keep one stable dictation input across Setup → Practice only.')
          session_end = source.find(
              '  useEffect(() => {\n    const profileSubscription',
              session_start,
          )
          if session_start < 0 or session_end < 0:
              raise SystemExit('could not isolate the dictation-session effect')
          source = source[:session_start] + source[session_end:]
          product.write_text(source)

          css_path = Path('src/app/app.css')
          css = css_path.read_text()
          comment_start = css.find('  /* Lock to the visual viewport so place screens (Words especially) cannot')
          comment_end = css.find('*/', comment_start)
          if comment_start < 0 or comment_end < 0:
              raise SystemExit('could not isolate the viewport-shell comment')
          css_comment = (
              '  /* Lock place screens to the visual viewport so long Words lists cannot\n'
              '     grow the scene and push the Scene-owned waypoint foot away. */'
          )
          css = css[:comment_start] + css_comment + css[comment_end + 2:]
          css_path.write_text(css)

          shell_path = Path('tests/app-shell.test.mjs')
          shell = shell_path.read_text()
          ios_line = "  '@capacitor/ios': '8.4.1',\n"
          keyboard_line = "  '@capacitor/keyboard': '8.0.5',\n"
          if keyboard_line not in shell:
              if shell.count(ios_line) != 1:
                  raise SystemExit('could not restore the unchanged Keyboard dependency expectation')
              shell = shell.replace(ios_line, ios_line + keyboard_line, 1)

          keyboard_assertion = shell.find('  // Shell height must not chase --keyboard-inset;')
          bank_search_assertion = shell.find(
              '  assert.match(\n    productCss,\n    /\\.bank-search',
              keyboard_assertion,
          )
          if keyboard_assertion >= 0:
              if bank_search_assertion < 0:
                  raise SystemExit('could not preserve the bank-search CSS assertion')
              shell = shell[:keyboard_assertion] + shell[bank_search_assertion:]
          shell_path.write_text(shell)
          PY

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "24.18.0"
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Verify the isolated Words slice
        run: |
          node --test \
            tests/word-bank-model.test.mjs \
            tests/product-learning-controller.test.mjs \
            tests/product-app-services.test.mjs \
            tests/app-shell.test.mjs
          npm run lint -- --quiet
          npm run build

      - name: Commit the tested product slice
        run: |
          git add \
            src/app/ProductApp.jsx \
            src/app/app.css \
            src/app/product-learning-controller.js \
            src/app/word-bank-model.js \
            tests/app-shell.test.mjs \
            tests/product-app-services.test.mjs \
            tests/product-learning-controller.test.mjs \
            tests/word-bank-model.test.mjs
          if git diff --cached --quiet; then
            echo "Clean Words slice is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat(words): finish clean search and set filtering"
          git push origin HEAD:agent/words-search-vocabulary-sets-clean
