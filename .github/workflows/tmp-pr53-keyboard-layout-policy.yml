name: Temporary apply PR53 keyboard layout policy

on:
  pull_request:

permissions:
  contents: write

concurrency:
  group: pr53-keyboard-layout-policy-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  patch:
    if: github.event.pull_request.number == 53 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the pull-request branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '24.18.0'
          cache: npm

      - name: Apply the native host and no-compaction policy
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path('.')

          scene = '''import UIKit
          import WebKit
          import Capacitor

          class SceneDelegate: UIResponder, UIWindowSceneDelegate {

              var window: UIWindow?

              private weak var keyboardWebView: WKWebView?
              private var keyboardObservers: [NSObjectProtocol] = []

              deinit {
                  for observer in keyboardObservers {
                      NotificationCenter.default.removeObserver(observer)
                  }
              }

              private func isOfflineB4Bundle() -> Bool {
                  guard let url = Bundle.main.url(
                      forResource: "index",
                      withExtension: "html",
                      subdirectory: "public"
                  ), let source = try? String(contentsOf: url, encoding: .utf8) else {
                      return false
                  }
                  return source.contains("name=\\\"ks2-spelling-build-mode\\\"") &&
                      source.contains("content=\\\"B4Development\\\"")
              }

              func scene(
                  _ scene: UIScene,
                  willConnectTo session: UISceneSession,
                  options connectionOptions: UIScene.ConnectionOptions
              ) {
                  guard scene is UIWindowScene,
                        let bridgeViewController = window?.rootViewController as? CAPBridgeViewController else {
                      return
                  }
                  bridgeViewController.loadViewIfNeeded()

                  if let webView = bridgeViewController.webView {
                      installKeyboardHostPolicy(on: webView)
                  }

                  if !isOfflineB4Bundle() {
                      bridgeViewController.bridge?.registerPluginInstance(ParentAccessPlugin())
                      bridgeViewController.bridge?.registerPluginInstance(LocalDataProtectionPlugin())
                      bridgeViewController.bridge?.registerPluginInstance(InstalledAudioPlugin())
                      bridgeViewController.bridge?.registerPluginInstance(LearningBackupFilePlugin())
                      bridgeViewController.bridge?.registerPluginInstance(PackTransferPlugin())
                      bridgeViewController.bridge?.registerPluginInstance(CommercePlugin())
                  }
                  #if B3_SANDBOX_PROOF
                  bridgeViewController.bridge?.registerPluginInstance(BuildAuthorityPlugin())
                  bridgeViewController.bridge?.registerPluginInstance(B3ProofObservationPlugin())
                  #endif
              }

              func sceneDidBecomeActive(_ scene: UIScene) {
                  guard let webView = keyboardWebView else { return }
                  clearInputAssistantItems(in: webView)
              }

              private func installKeyboardHostPolicy(on webView: WKWebView) {
                  keyboardWebView = webView

                  // Capacitor installs a global WKContentView focus wrapper. Removing
                  // this WebView's override makes that wrapper pass WebKit's real
                  // user-interaction value through: a genuine tap stays genuine and
                  // a delayed focus cannot masquerade as one minutes later.
                  webView.capacitor.setKeyboardShouldRequireUserInteraction(nil)

                  // Previous / next / done are UIKit input-assistant groups, not part
                  // of the spelling product. Clearing the public groups removes their
                  // bar without linking the Capacitor Keyboard plugin or swizzling a
                  // private WebKit accessory-view selector.
                  clearInputAssistantItems(in: webView)
                  guard keyboardObservers.isEmpty else { return }
                  for name in [
                      UIResponder.keyboardWillShowNotification,
                      UIResponder.keyboardWillChangeFrameNotification
                  ] {
                      keyboardObservers.append(
                          NotificationCenter.default.addObserver(
                              forName: name,
                              object: nil,
                              queue: .main
                          ) { [weak self] _ in
                              guard let webView = self?.keyboardWebView else { return }
                              self?.clearInputAssistantItems(in: webView)
                          }
                      )
                  }
              }

              private func clearInputAssistantItems(in view: UIView) {
                  view.inputAssistantItem.leadingBarButtonGroups = []
                  view.inputAssistantItem.trailingBarButtonGroups = []
                  for subview in view.subviews {
                      clearInputAssistantItems(in: subview)
                  }
              }
          }
          '''
          scene = '\n'.join(line[10:] if line.startswith('          ') else line for line in scene.splitlines()) + '\n'
          (root / 'ios/App/App/SceneDelegate.swift').write_text(scene)

          product_root = '''import ProductApp from './ProductApp.jsx';

          export default function ProductRoot({ services }) {
            if (services?.mode !== 'product') {
              throw new TypeError('Production root requires product services.');
            }

            return <ProductApp services={services} />;
          }
          '''
          product_root = '\n'.join(line[10:] if line.startswith('          ') else line for line in product_root.splitlines()) + '\n'
          (root / 'src/app/ProductRoot.jsx').write_text(product_root)

          for path in [
              root / 'src/app/keyboard-inset.js',
              root / 'src/app/ios-dictation-input-session.css',
          ]:
              path.unlink(missing_ok=True)

          answer_test = '''import assert from 'node:assert/strict';
          import { existsSync } from 'node:fs';
          import { readFile } from 'node:fs/promises';
          import { dirname, join } from 'node:path';
          import test from 'node:test';
          import { fileURLToPath } from 'node:url';

          import { spellingOnly } from '../src/app/practice-feel.js';

          const ROOT = dirname(dirname(fileURLToPath(import.meta.url)));

          test('spellingOnly keeps the letters a spelling can hold and drops the rest', () => {
            assert.equal(spellingOnly('bicycle'), 'bicycle');
            assert.equal(spellingOnly('bicy2cle'), 'bicycle');
            assert.equal(spellingOnly('12345'), '');
            assert.equal(spellingOnly("don't"), "don't");
            assert.equal(spellingOnly('don’t'), 'don’t');
            assert.equal(spellingOnly('self-respect'), 'self-respect');
            assert.equal(spellingOnly('  bi cycle!  '), 'bicycle');
            assert.equal(spellingOnly('café'), 'café');
            assert.equal(spellingOnly(null), '');
            assert.equal(spellingOnly(42), '');
          });

          test('dictation layout leaves keyboard geometry to the native host', async () => {
            assert.equal(existsSync(join(ROOT, 'src/app/keyboard-inset.js')), false);
            assert.equal(
              existsSync(join(ROOT, 'src/app/ios-dictation-input-session.css')),
              false,
            );
            const [productRoot, appCss] = await Promise.all([
              readFile(join(ROOT, 'src/app/ProductRoot.jsx'), 'utf8'),
              readFile(join(ROOT, 'src/app/app.css'), 'utf8'),
            ]);
            assert.doesNotMatch(
              `${productRoot}\n${appCss}`,
              /observeKeyboardInset|--keyboard-inset|--dictation-visible-height|data-room=['"]tight['"]/,
            );
          });
          '''
          answer_test = '\n'.join(line[10:] if line.startswith('          ') else line for line in answer_test.splitlines()) + '\n'
          (root / 'tests/answer-keyboard.test.mjs').write_text(answer_test)

          path = root / 'tests/ios-dictation-input-session.test.mjs'
          text = path.read_text()
          pattern = re.compile(
              r"test\('the product root owns the public-API iOS session and visual viewport layout',[\s\S]*?\n\}\);\n\n(?=test\('small dictation-session helpers)",
          )
          replacement = '''test('the product root scopes the stable iOS session without resizing the round', async () => {
            const [productRoot, productApp, sessionSource, mainSource] = await Promise.all([
              readFile(join(ROOT, 'src/app/ProductRoot.jsx'), 'utf8'),
              readFile(join(ROOT, 'src/app/ProductApp.jsx'), 'utf8'),
              readFile(join(ROOT, 'src/platform/keyboard/ios-dictation-input-session.js'), 'utf8'),
              readFile(join(ROOT, 'src/main.jsx'), 'utf8'),
            ]);

            assert.doesNotMatch(
              productRoot,
              /observeKeyboardInset|keyboard-inset|ios-dictation-input-session\\.css|Capacitor/,
            );
            assert.doesNotMatch(productRoot, /installIOSDictationInputSession/);

            assert.match(productApp, /installIOSDictationInputSession\\(\\)/);
            assert.match(productApp, /needsDictationSession/);
            assert.match(productApp, /screen === 'setup'/);
            assert.match(productApp, /screen === 'practice'/);

            assert.match(sessionSource, /sessionInput\\.addEventListener\\('pointerdown', onSessionPointerDown\\)/);
            assert.match(sessionSource, /startButton\\.click\\(\\)/);
            assert.match(sessionSource, /document\\.addEventListener\\('click', onDocumentActivation, true\\)/);
            assert.match(sessionSource, /document\\.addEventListener\\('scroll', reposition, true\\)/);
            assert.match(sessionSource, /document\\.addEventListener\\('focusin', onDocumentFocusIn, true\\)/);
            assert.match(sessionSource, /writeControlledInputValue\\(roundInput, buffered, view\\)/);
            assert.match(sessionSource, /pauseRoundInputSession\\(\\)/);
            assert.match(sessionSource, /record\\.attributeName === 'disabled'/);
            assert.match(sessionSource, /!document\\.querySelector\\(EXIT_DIALOG_SELECTOR\\)/);
            assert.match(sessionSource, /resumeRoundInputSession\\(\\{ guardFocus: true \\}\\)/);
            assert.doesNotMatch(sessionSource, /Keyboard\\.show|keyboardDisplayRequiresUserAction/);

            assert.doesNotMatch(mainSource, /applyKeyboardChrome|@capacitor\\/keyboard/);
          });

          '''
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit('dictation architecture test block not found')
          path.write_text(text)

          path = root / 'tests/ios-keyboard-ownership.test.mjs'
          text = path.read_text()
          anchor = """  assert.equal(
            existsSync(join(ROOT, 'src/platform/keyboard/capacitor-keyboard.js')),
            false,
            'the old global Keyboard helper must not survive as an importable seam',
          );
          """
          addition = anchor + """  for (const removedLayoutOwner of [
            'src/app/keyboard-inset.js',
            'src/app/ios-dictation-input-session.css',
          ]) {
            assert.equal(
              existsSync(join(ROOT, removedLayoutOwner)),
              false,
              `${removedLayoutOwner} must not reclaim software-keyboard geometry`,
            );
          }
          """
          if anchor not in text:
              raise SystemExit('keyboard helper assertion anchor not found')
          text = text.replace(anchor, addition, 1)

          anchor = """  assert.doesNotMatch(
            sceneDelegateSource,
            /setKeyboardShouldRequireUserInteraction\\((?:true|false)\\)/,
            'the app must preserve WebKit’s real user-interaction value instead of forcing either state',
          );
          """
          addition = anchor + """  assert.match(sceneDelegateSource, /import WebKit/);
          assert.match(sceneDelegateSource, /inputAssistantItem\\.leadingBarButtonGroups = \\[\\]/);
          assert.match(sceneDelegateSource, /inputAssistantItem\\.trailingBarButtonGroups = \\[\\]/);
          assert.match(sceneDelegateSource, /UIResponder\\.keyboardWillShowNotification/);
          assert.match(sceneDelegateSource, /UIResponder\\.keyboardWillChangeFrameNotification/);
          """
          if anchor not in text:
              raise SystemExit('scene passthrough assertion anchor not found')
          text = text.replace(anchor, addition, 1)
          text = text.replace(
              "  assert.doesNotMatch(productRootSource, /installIOSDictationInputSession/);\n",
              "  assert.doesNotMatch(\n"
              "    productRootSource,\n"
              "    /installIOSDictationInputSession|observeKeyboardInset|keyboard-inset|ios-dictation-input-session\\.css/,\n"
              "  );\n",
              1,
          )
          path.write_text(text)

          path = root / 'tests/ios-project-contract.test.mjs'
          text = path.read_text()
          anchor = "  assert.match(sceneDelegate, /bridgeViewController\\.loadViewIfNeeded\\(\\)/);\n"
          addition = anchor + """  assert.match(sceneDelegate, /import WebKit/);
            assert.match(
              sceneDelegate,
              /webView\\.capacitor\\.setKeyboardShouldRequireUserInteraction\\(nil\\)/,
            );
            assert.match(sceneDelegate, /inputAssistantItem\\.leadingBarButtonGroups = \\[\\]/);
            assert.match(sceneDelegate, /inputAssistantItem\\.trailingBarButtonGroups = \\[\\]/);
          """
          if anchor not in text:
              raise SystemExit('iOS SceneDelegate contract anchor not found')
          text = text.replace(anchor, addition, 1)
          path.write_text(text)
          PY

      - name: Install exact dependencies
        run: npm ci --no-audit --no-fund

      - name: Run focused regression gates
        run: |
          node --test \
            tests/answer-keyboard.test.mjs \
            tests/ios-dictation-input-session.test.mjs \
            tests/ios-keyboard-ownership.test.mjs \
            tests/ios-project-contract.test.mjs
          npm run lint
          npm run build
          git diff --check

      - name: Remove temporary workflow and commit
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          rm -f .github/workflows/tmp-pr53-keyboard-layout-policy.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(ios): stop compacting dictation around the keyboard'
          git push origin "HEAD:${HEAD_REF}"
