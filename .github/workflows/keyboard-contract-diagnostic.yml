name: Temporary Maven timeout patch

on:
  pull_request:

permissions:
  contents: write

concurrency:
  group: maven-timeout-patch-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  patch:
    name: Apply ref-counted Maven timeout
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Fetch the pull-request branch quietly
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          git init -q .
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${REPOSITORY}.git"
          git fetch -q --depth=1 origin "$HEAD_SHA"
          git checkout -q -B "$HEAD_REF" FETCH_HEAD
      - name: Apply the bounded timeout correction
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('scripts/lib/maven-evidence.mjs')
          text = path.read_text()
          if 'function createMavenFetchTimeout(' in text:
              print('Maven timeout correction is already present.')
              raise SystemExit(0)

          marker = 'export async function fetchVerifiedMavenPom({'
          helper = """function createMavenFetchTimeout(timeoutMilliseconds) {
            const controller = new AbortController();
            // Node implements AbortSignal.timeout() with an unref'ed timer. A mocked
            // or stalled fetch can therefore leave the awaited promise pending while
            // the process exits. This owned timer stays referenced until the fetch
            // settles, then is always cleared by the caller.
            const timer = setTimeout(() => {
              const error = new Error(
                `Maven POM fetch timed out after ${timeoutMilliseconds} ms`,
              );
              error.name = 'TimeoutError';
              controller.abort(error);
            }, timeoutMilliseconds);
            return Object.freeze({
              signal: controller.signal,
              clear: () => clearTimeout(timer),
            });
          }

          """
          if text.count(marker) != 1:
              raise SystemExit('Expected one fetchVerifiedMavenPom declaration.')
          text = text.replace(marker, helper + marker, 1)

          loop_marker = """  for (const repository of repositories) {
            const sourceUrl = `${repository}${relativePath}`;
          """
          loop_replacement = loop_marker + '    const timeout = createMavenFetchTimeout(timeoutMilliseconds);\n'
          if text.count(loop_marker) != 1:
              raise SystemExit('Expected one Maven repository loop.')
          text = text.replace(loop_marker, loop_replacement, 1)

          signal = '        signal: AbortSignal.timeout(timeoutMilliseconds),'
          if text.count(signal) != 1:
              raise SystemExit('Expected one AbortSignal.timeout call.')
          text = text.replace(signal, '        signal: timeout.signal,', 1)

          catch = """    } catch (error) {
            failures.push(`${error.name}:${repository}`);
          }
          """
          replacement = """    } catch (error) {
            failures.push(`${error.name}:${repository}`);
          } finally {
            timeout.clear();
          }
          """
          if text.count(catch) != 1:
              raise SystemExit('Expected one Maven fetch catch block.')
          text = text.replace(catch, replacement, 1)
          path.write_text(text)
          PY
      - name: Commit and push the correction once
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          if git diff --quiet -- scripts/lib/maven-evidence.mjs; then
            echo "No correction to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/lib/maven-evidence.mjs
          git commit -m "fix(build): keep Maven fetch timeout live"
          git push origin "HEAD:${HEAD_REF}"
