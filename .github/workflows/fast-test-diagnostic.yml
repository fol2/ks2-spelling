name: Temporary keyboard audit patch

on:
  pull_request:

permissions:
  contents: write

concurrency:
  group: keyboard-audit-patch-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  patch:
    name: Classify Keyboard JavaScript as unbundled
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Fetch the pull-request branch quietly
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          git init -q .
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${REPOSITORY}.git"
          git fetch -q --depth=1 origin "$HEAD_SHA"
          git checkout -q -B "$HEAD_REF" FETCH_HEAD
      - name: Update the audited package boundary and its regression test
        run: |
          python3 - <<'PY'
          from pathlib import Path

          audit = Path('scripts/audit-dependencies.mjs')
          text = audit.read_text()
          old = """  '@capacitor/haptics',
            '@capacitor/keyboard',
            'phaser',
          """
          new = """  '@capacitor/haptics',
            // The Keyboard plugin remains an audited native build source. Product
            // JavaScript deliberately does not import or bundle its runtime facade.
            'phaser',
          """
          if old not in text:
              if 'JavaScript deliberately does not import or bundle its runtime facade.' not in text:
                  raise SystemExit('Expected WebView package authority was not found.')
          else:
              text = text.replace(old, new, 1)
              audit.write_text(text)

          test = Path('tests/dependency-policy.test.mjs')
          text = test.read_text()
          marker = "  assert.ok(report.npm.lockPackageCount >= 150);\n"
          addition = marker + """  assert.ok(
            report.npm.production.some(({ name }) => name === '@capacitor/keyboard'),
            'the native Keyboard plugin must remain an audited production dependency',
          );
            assert.equal(
              report.npm.webViewBundle.packageNames.includes('@capacitor/keyboard'),
              false,
              'ordinary keyboard ownership must not require the Keyboard JavaScript facade',
            );
          """
          if 'ordinary keyboard ownership must not require the Keyboard JavaScript facade' not in text:
              if text.count(marker) != 1:
                  raise SystemExit('Expected dependency policy assertion marker was not found.')
              text = text.replace(marker, addition, 1)
              test.write_text(text)
          PY
          git diff --check
      - name: Commit and push the reviewed authority change once
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          if git diff --quiet -- scripts/audit-dependencies.mjs tests/dependency-policy.test.mjs; then
            echo "No authority change to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/audit-dependencies.mjs tests/dependency-policy.test.mjs
          git commit -m "fix(ios): classify Keyboard as native-only"
          git push origin "HEAD:${HEAD_REF}"
