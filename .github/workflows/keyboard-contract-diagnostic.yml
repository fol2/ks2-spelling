name: Temporary keyboard contract diagnostic

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: keyboard-contract-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  keyboard-contract:
    name: Keyboard regression suites
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Fetch the exact pull-request head quietly
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          git init -q .
          git remote add origin "https://github.com/${REPOSITORY}.git"
          git fetch -q --depth=1 origin "$HEAD_SHA"
          git checkout -q --detach FETCH_HEAD
      - name: Install dependencies quietly
        run: npm ci --silent --no-audit --no-fund
      - name: Run keyboard ownership contract
        run: node --test tests/ios-keyboard-ownership.test.mjs
      - name: Run dictation-session regression suite
        run: node --test tests/ios-dictation-input-session.test.mjs
      - name: Run product-shell regression suite
        run: node --test tests/app-shell.test.mjs
      - name: Run viewport and answer-keyboard suite
        run: node --test tests/answer-keyboard.test.mjs
