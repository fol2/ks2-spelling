name: PR55 real Practice keyboard probe hardening

on:
  push:
    branches:
      - agent/keyboard-reset-visible-input

permissions:
  contents: write

concurrency:
  group: pr55-practice-probe-${{ github.ref }}
  cancel-in-progress: false

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: macos-26
    timeout-minutes: 110
    env:
      EXPECTED_PARENT: fd90d49260c5c07ea05c51e30de9e0798115ed0c
    steps:
      - name: Check out the exact keyboard-reset branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          ref: agent/keyboard-reset-visible-input

      - name: Prove the hardening starts at the reviewed head
        run: |
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          test "$(git diff --name-only HEAD^ HEAD)" = '.github/workflows/pr55-practice-probe-hardening.yml'

      - name: Make the native probe reach the real Practice field
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path_name: str, old: str, new: str) -> None:
              path = Path(path_name)
              source = path.read_text()
              count = source.count(old)
              if count != 1:
                  raise SystemExit(
                      f'{path_name}: expected one replacement, found {count}'
                  )
              path.write_text(source.replace(old, new, 1))

          swift = 'ios/App/B3ProofUITests/C5ProductLayoutTests.swift'
          replace_once(
              swift,
              '''    private func reachableNicknameField(
                  in application: XCUIApplication
              ) -> XCUIElement {
                  let nickname = application.textFields["First name or nickname"]
                  let webView = application.webViews.firstMatch
                  XCTAssertTrue(
                      nickname.waitForExistence(timeout: 10),
                      "The production learner name field did not appear."
                  )
                  for _ in 0..<12 where !nickname.isHittable {
                      webView.swipeUp()
                  }
                  XCTAssertTrue(nickname.isHittable, "The production learner form is not reachable.")
                  assertContained(nickname, in: application)
                  return nickname
              }
          ''',
              '''    @discardableResult
              private func reveal(
                  _ element: XCUIElement,
                  in application: XCUIApplication,
                  message: String,
                  swipeUp: Bool = true
              ) -> XCUIElement {
                  XCTAssertTrue(element.waitForExistence(timeout: 10), message)
                  let webView = application.webViews.firstMatch
                  for _ in 0..<12 where !element.isHittable {
                      if swipeUp {
                          webView.swipeUp()
                      } else {
                          webView.swipeDown()
                      }
                  }
                  XCTAssertTrue(element.isHittable, message)
                  assertContained(element, in: application)
                  return element
              }

              private func reachableNicknameField(
                  in application: XCUIApplication
              ) -> XCUIElement {
                  let nickname = application.textFields["First name or nickname"]
                  if !nickname.waitForExistence(timeout: 1) {
                      let addLearner = application.buttons["Add a learner"]
                      reveal(
                          addLearner,
                          in: application,
                          message: "The Add a learner action is not reachable."
                      ).tap()
                  }
                  return reveal(
                      nickname,
                      in: application,
                      message: "The production learner name field did not appear."
                  )
              }
          ''',
          )
          marker = '''    private func assertProfilePicker(
                  in application: XCUIApplication
              ) {
          '''
          addition = '''    private func pressSubmissionKey(on keyboard: XCUIElement) {
                  for label in ["done", "Done", "return", "Return", "go", "Go"] {
                      let button = keyboard.buttons[label]
                      if button.exists && button.isHittable {
                          button.tap()
                          return
                      }
                      let key = keyboard.keys[label]
                      if key.exists && key.isHittable {
                          key.tap()
                          return
                      }
                  }
                  XCTFail("The visible field keyboard has no usable submission key.")
              }

              private func openPracticeForKeyboardProbe(
                  in application: XCUIApplication
              ) -> XCUIElement {
                  let learnerName = "Keyboard runner \(Int(Date().timeIntervalSince1970))"
                  let nickname = reachableNicknameField(in: application)
                  nickname.tap()
                  let profileKeyboard = requireSoftwareLetterKeys(in: application)
                  nickname.typeText(learnerName)
                  pressSubmissionKey(on: profileKeyboard)

                  let trailSetOff = application.buttons["Set off"]
                  if !trailSetOff.waitForExistence(timeout: 5) {
                      let addLearner = application.buttons["Add learner"]
                      if addLearner.exists {
                          reveal(
                              addLearner,
                              in: application,
                              message: "The learner form could not be submitted."
                          ).tap()
                      }
                  }
                  if !trailSetOff.waitForExistence(timeout: 10) {
                      let learner = application.staticTexts[learnerName]
                      reveal(
                          learner,
                          in: application,
                          message: "The newly created learner could not be selected."
                      ).tap()
                  }
                  reveal(
                      trailSetOff,
                      in: application,
                      message: "The Trail Set off action did not appear."
                  ).tap()

                  XCTAssertTrue(
                      application.staticTexts["Vocabulary set"].waitForExistence(timeout: 10),
                      "The round setup screen did not appear."
                  )
                  let setupSetOff = application.buttons.matching(
                      NSPredicate(format: "label BEGINSWITH %@", "Set off")
                  ).firstMatch
                  reveal(
                      setupSetOff,
                      in: application,
                      message: "The setup Set off action is not reachable."
                  ).tap()

                  let labelled = application.textFields["Type the spelling"]
                  let placeholder = application.textFields["your spelling"]
                  let spelling = labelled.waitForExistence(timeout: 3)
                      ? labelled
                      : placeholder
                  return reveal(
                      spelling,
                      in: application,
                      message: "The actual visible Practice spelling field did not appear."
                  )
              }

          '''
          path = Path(swift)
          source = path.read_text()
          if source.count(marker) != 1:
              raise SystemExit('unexpected Swift helper insertion marker')
          source = source.replace(marker, addition + marker, 1)
          test_marker = '''    func testProductTabletLayouts() {
          '''
          test_addition = '''    func testProductPracticeFieldKeepsSoftwareKeyboardAcrossReturn() {
                  continueAfterFailure = false

                  XCTAssertEqual(
                      UIDevice.current.userInterfaceIdiom,
                      .phone,
                      "The Practice keyboard probe requires an iPhone destination."
                  )
                  let application = installedApplication()
                  XCUIDevice.shared.orientation = .portrait
                  application.terminate()
                  application.launch()

                  XCTAssertTrue(
                      waitForOrientation(application, landscape: false),
                      "The Practice keyboard-probe application did not settle in portrait."
                  )
                  let spelling = openPracticeForKeyboardProbe(in: application)
                  spelling.tap()
                  let keyboard = requireSoftwareLetterKeys(in: application)
                  spelling.typeText("zzzzzz")
                  XCTAssertEqual(spelling.value as? String, "zzzzzz")
                  pressSubmissionKey(on: keyboard)

                  let answerWasProcessed = XCTNSPredicateExpectation(
                      predicate: NSPredicate { object, _ in
                          guard let field = object as? XCUIElement else { return false }
                          return (field.value as? String) != "zzzzzz"
                      },
                      object: spelling
                  )
                  XCTAssertEqual(
                      XCTWaiter.wait(for: [answerWasProcessed], timeout: 10),
                      .completed,
                      "The Return submission did not finish exactly once."
                  )
                  _ = requireSoftwareLetterKeys(in: application)
                  spelling.typeText("a")
                  XCTAssertEqual(
                      spelling.value as? String,
                      "a",
                      "The same visible Practice field did not retain keyboard ownership."
                  )
                  attachScreenshot(name: "c5-product-practice-return-keyboard")
              }

          '''
          if source.count(test_marker) != 1:
              raise SystemExit('unexpected Swift test insertion marker')
          path.write_text(source.replace(test_marker, test_addition + test_marker, 1))

          js = 'tests/keyboard-reset-visible-input.test.mjs'
          js_marker = "test('the native Keyboard plugin stays absent from runtime and dependency roots', async () => {"
          js_addition = '''test('the native probe opens the learner form and reaches the real Practice field', async () => {
            const nativeProbe = await source(
              'ios/App/B3ProofUITests/C5ProductLayoutTests.swift',
            );

            assert.match(nativeProbe, /buttons\["Add a learner"\]/u);
            assert.match(nativeProbe, /textFields\["Type the spelling"\]/u);
            assert.match(nativeProbe, /openPracticeForKeyboardProbe/u);
            assert.match(nativeProbe, /spelling\.typeText\("zzzzzz"\)/u);
            assert.match(nativeProbe, /pressSubmissionKey\(on: keyboard\)/u);
            assert.match(nativeProbe, /spelling\.typeText\("a"\)/u);
          });

          '''
          path = Path(js)
          source = path.read_text()
          if source.count(js_marker) != 1:
              raise SystemExit('unexpected keyboard-reset test insertion marker')
          path.write_text(source.replace(js_marker, js_addition + js_marker, 1))
          PY

      - name: Verify web, native sync and the UI-test target
        run: |
          npm ci
          node --test \
            tests/keyboard-reset-visible-input.test.mjs \
            tests/visible-input-saving-state.test.mjs \
            tests/dependency-policy.test.mjs \
            tests/word-bank-model.test.mjs \
            tests/product-learning-controller.test.mjs \
            tests/product-app-services.test.mjs \
            tests/app-shell.test.mjs
          npm run test:fast
          npm run lint -- --quiet
          npm run build
          npm run native:sync:check
          npm run test:ios
          npm run sync:b4-development
          xcodebuild \
            -quiet \
            -project ios/App/App.xcodeproj \
            -scheme B4DevelopmentUITests \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath .native-build/pr55-practice-probe \
            CODE_SIGNING_ALLOWED=NO \
            build-for-testing
          git diff --check

      - name: Commit the durable probe and remove one-use machinery
        run: |
          git add \
            ios/App/B3ProofUITests/C5ProductLayoutTests.swift \
            tests/keyboard-reset-visible-input.test.mjs
          git rm .github/workflows/pr55-practice-probe-hardening.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test(ios): probe the actual Practice keyboard path'
          git push origin HEAD:agent/keyboard-reset-visible-input
