name: PR56 pinned Flutter clear-contract correction

on:
  push:
    branches:
      - spike/flutter-flame-vertical-slice

permissions:
  contents: write

concurrency:
  group: pr56-clear-contract-${{ github.ref }}
  cancel-in-progress: false

jobs:
  correct:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      EXPECTED_PARENT: b3108a52038b94be6966d479a7814fece79fc12c
      FLUTTER_COMMIT: 84fc5cbb223bc12f83d65b647ff8a56caf779ffd
    steps:
      - name: Check out the exact spike branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          ref: spike/flutter-flame-vertical-slice

      - name: Prove the correction starts at the reviewed head
        run: |
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          test "$(git diff --name-only HEAD^ HEAD)" = '.github/workflows/pr56-clear-contract-correction.yml'

      - name: Align the code and evidence with pinned Flutter
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path_name: str, old: str, new: str) -> None:
              path = Path(path_name)
              source = path.read_text()
              count = source.count(old)
              if count != 1:
                  raise SystemExit(
                      f'{path_name}: expected one replacement, found {count}'
                  )
              path.write_text(source.replace(old, new, 1))

          replace_once(
              'spikes/flutter_ks2_spelling/lib/spelling_spike_app.dart',
              '''        if (correct) {
                    _answerController.value = const TextEditingValue(
                      text: '',
                      selection: TextSelection.collapsed(offset: 0),
                    );
                  } else {''',
              '''        if (correct) {
                    _answerController.clear();
                  } else {''',
          )

          replace_once(
              'docs/spikes/flutter-flame-vertical-slice.md',
              '''- a successful save clears the field with an explicit valid caret position rather than the invalid `-1` selection produced by a bare controller clear;''',
              '''- a successful save uses the pinned Flutter controller's ordinary `clear()` operation, and a widget test proves the resulting selection remains valid at offset `0`;''',
          )

          replace_once(
              'spikes/flutter_ks2_spelling/README.md',
              '''A successful save clears to a valid caret position; a failed save preserves the answer and restores editing.''',
              '''A successful save uses Flutter's ordinary controller clear and the widget contract proves its caret remains valid at offset `0`; a failed save preserves the answer and restores editing.''',
          )
          PY

      - name: Verify against the exact pinned Flutter implementation
        run: |
          git clone --depth 1 --branch 3.44.7 \
            https://github.com/flutter/flutter.git \
            "$RUNNER_TEMP/flutter"
          test "$(git -C "$RUNNER_TEMP/flutter" rev-parse HEAD)" = "$FLUTTER_COMMIT"
          grep -Fq 'value = const TextEditingValue(selection: TextSelection.collapsed(offset: 0));' \
            "$RUNNER_TEMP/flutter/packages/flutter/lib/src/widgets/editable_text.dart"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/flutter/bin/flutter" config --no-analytics
          "$RUNNER_TEMP/flutter/bin/flutter" precache --linux
          sudo apt-get update
          sudo apt-get install -y \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            libsqlite3-dev

      - name: Analyse and test the corrected slice
        working-directory: spikes/flutter_ks2_spelling
        run: |
          flutter pub get --enforce-lockfile
          flutter analyze
          flutter test
          git diff --check

      - name: Commit the durable correction and remove one-use machinery
        run: |
          git add \
            docs/spikes/flutter-flame-vertical-slice.md \
            spikes/flutter_ks2_spelling/README.md \
            spikes/flutter_ks2_spelling/lib/spelling_spike_app.dart
          git rm .github/workflows/pr56-clear-contract-correction.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'refactor(spike): use the pinned Flutter clear contract'
          git push origin HEAD:spike/flutter-flame-vertical-slice
