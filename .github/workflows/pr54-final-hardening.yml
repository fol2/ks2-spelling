name: PR54 final Words hardening

on:
  pull_request:
    branches:
      - main
    types: [opened, reopened, synchronize]

permissions:
  contents: write

concurrency:
  group: pr54-final-hardening-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  harden:
    if: >-
      github.event.pull_request.head.ref == 'agent/words-search-vocabulary-sets-clean' &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out the exact Words branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          ref: agent/words-search-vocabulary-sets-clean

      - name: Join catalogue metadata to the reviewed Word Bank UI
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def replace_once(path, pattern, replacement, flags=0):
              file = Path(path)
              source = file.read_text()
              updated, count = re.subn(pattern, replacement, source, count=1, flags=flags)
              if count != 1:
                  raise SystemExit(f'{path}: expected one replacement, found {count}')
              file.write_text(updated)

          replace_once(
              'src/app/product-learning-controller.js',
              r"\.map\(\(\{ runtimeItemId, target, yearBand \}\) => \{\n"
              r"(\s+const progress = saved\[runtimeItemId\];\n\s+return \{\n"
              r"\s+runtimeItemId,\n\s+target,\n\s+yearBand: yearBand \?\? null,)",
              "    .map(({ runtimeItemId, target, yearBand, coverageTier }) => {\n"
              r"\1\n        coverageTier: coverageTier ?? null,",
          )
          replace_once(
              'tests/product-learning-controller.test.mjs',
              r"return catalogue\.items\.map\(\(\{ runtimeItemId, target, yearBand \}\) => \(\{\n"
              r"(\s+runtimeItemId,\n\s+target,\n\s+yearBand: yearBand \?\? null,)",
              "return catalogue.items.map(({ runtimeItemId, target, yearBand, coverageTier }) => ({\n"
              r"\1\n    coverageTier: coverageTier ?? null,",
          )

          replace_once(
              'src/app/ProductApp.jsx',
              r"function WordBankScreen\(\{ progress, onScreen, onStart \}\) \{",
              "function WordBankScreen({ progress, vocabularySets, onScreen, onStart }) {",
          )
          replace_once(
              'src/app/ProductApp.jsx',
              r"  const bank = useMemo\(\n"
              r"    \(\) => buildWordBank\(\{ progress, filter, vocabSet, query \}\),\n"
              r"    \[progress, filter, vocabSet, query\],\n"
              r"  \);",
              """  const bank = useMemo(
    () => buildWordBank({
      progress,
      filter,
      vocabSet,
      vocabularySets,
      query,
    }),
    [progress, filter, vocabSet, vocabularySets, query],
  );""",
          )
          replace_once(
              'src/app/ProductApp.jsx',
              r'            <span className="figure">\{bank\.countLabel\}</span>',
              """            <span
              id="bank-result-count"
              className="figure"
              role="status"
              aria-live="polite"
              aria-atomic="true"
            >
              {bank.countLabel}
            </span>""",
          )
          replace_once(
              'src/app/ProductApp.jsx',
              r'              enterKeyHint="search"\n'
              r'              onChange=\{\(event\) => setQuery\(event\.target\.value\)\}',
              """              enterKeyHint="search"
              maxLength={64}
              aria-describedby="bank-result-count"
              onChange={(event) => setQuery(event.target.value)}
              onKeyDown={(event) => {
                if (event.key === 'Escape' && query) {
                  event.preventDefault();
                  setQuery('');
                }
              }}""",
          )
          replace_once(
              'src/app/ProductApp.jsx',
              r"(\s+aria-pressed=\{option\.selected\}\n)"
              r"(\s+onClick=\{\(\) => setVocabSet\(option\.id\)\})",
              r"\1                aria-label={`${option.label}, ${option.count} ${option.count === 1 ? 'word' : 'words'}`}\n\2",
          )
          replace_once(
              'src/app/ProductApp.jsx',
              r"(\s+aria-pressed=\{option\.selected\}\n)"
              r"(\s+onClick=\{\(\) => setFilter\(option\.id\)\})",
              r"\1                aria-label={`${option.label}, ${option.count} ${option.count === 1 ? 'word' : 'words'}`}\n\2",
          )
          replace_once(
              'src/app/ProductApp.jsx',
              r"(      <WordBankScreen\n        progress=\{learningState\.progress\}\n)"
              r"(        onScreen=\{showScreen\})",
              r"\1        vocabularySets={learningState.vocabularySets}\n\2",
          )

          replace_once(
              'tests/app-shell.test.mjs',
              r"  assert\.match\(emptyProgressHtml, /id=\"bank-search-input\"/\);\n"
              r"  assert\.match\(emptyProgressHtml, /placeholder=\"Search spellings\"/\);\n"
              r"  assert\.match\(emptyProgressHtml, /aria-label=\"Vocabulary set\"/\);\n"
              r"  assert\.match\(emptyProgressHtml, /aria-label=\"Filter words\"/\);\n"
              r"  for \(const set of \['Core', 'Y3–4', 'Y5–6'\]\) \{\n"
              r"    assert\.match\(emptyProgressHtml, new RegExp\(`>\$\{set\}<`\)\);\n"
              r"  \}",
              """  assert.match(emptyProgressHtml, /id="bank-search-input"/);
  assert.match(emptyProgressHtml, /placeholder="Search spellings"/);
  assert.match(emptyProgressHtml, /maxLength="64"/);
  assert.match(emptyProgressHtml, /aria-describedby="bank-result-count"/);
  assert.match(emptyProgressHtml, /id="bank-result-count"[^>]*role="status"/);
  assert.match(emptyProgressHtml, /aria-label="Vocabulary set"/);
  assert.match(emptyProgressHtml, /aria-label="Filter words"/);
  for (const set of ['Core', 'Y3–4']) {
    assert.match(emptyProgressHtml, new RegExp(`>${set}<`));
  }
  assert.doesNotMatch(emptyProgressHtml, />Y5–6</);
  assert.match(productSource, /vocabularySets=\{learningState\.vocabularySets\}/u);
  assert.match(productSource, /event\.key === 'Escape'/u);""",
          )
          PY

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "24.18.0"
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Verify the complete hardened Words slice
        run: |
          node --test \
            tests/word-bank-model.test.mjs \
            tests/product-learning-controller.test.mjs \
            tests/product-app-services.test.mjs \
            tests/app-shell.test.mjs
          npm run test:fast
          npm run lint -- --quiet
          npm run build
          git diff --check

      - name: Commit product code only and remove this one-use gate
        run: |
          git add \
            src/app/ProductApp.jsx \
            src/app/product-learning-controller.js \
            tests/product-learning-controller.test.mjs \
            tests/app-shell.test.mjs
          git rm .github/workflows/pr54-final-hardening.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "refactor(words): finish catalogue-aware Word Bank"
          git push origin HEAD:agent/words-search-vocabulary-sets-clean
