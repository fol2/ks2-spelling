name: PR54 deeper Words hardening

on:
  push:
    branches:
      - agent/words-search-vocabulary-sets-clean

permissions:
  contents: write

concurrency:
  group: pr54-deep-hardening-${{ github.ref }}
  cancel-in-progress: false

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      EXPECTED_PARENT: 4bac9c7fc8900edbe4155e4fff706780e92d9886
    steps:
      - name: Check out the exact Words branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          ref: agent/words-search-vocabulary-sets-clean

      - name: Prove the hardening starts at the reviewed head
        run: |
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          test "$(git diff --name-only HEAD^ HEAD)" = '.github/workflows/pr54-deep-hardening.yml'

      - name: Harden metadata parsing and accessible result counts
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path_name: str, old: str, new: str) -> None:
              path = Path(path_name)
              source = path.read_text()
              count = source.count(old)
              if count != 1:
                  raise SystemExit(
                      f'{path_name}: expected one replacement, found {count}'
                  )
              path.write_text(source.replace(old, new, 1))

          model = 'src/app/word-bank-model.js'
          replace_once(
              model,
              '''// Explicit controller metadata is authoritative when supplied. The Word Bank
          // can also stand alone in tests and previews: because progress projects every
          // catalogue item, its year bands are a complete fallback authority. Metadata
          // and rows are intersected so an unavailable or stale zero-sized set cannot be
          // offered as an empty control.
          function publishedVocabSets(value, words) {
            const candidates = Array.isArray(value) ? value : inferredVocabSets(words);
            const seen = new Set();
            const published = [];
            for (const candidate of candidates) {
              const definition = VOCAB_SET_BY_ID.get(candidate?.id);
              if (
                !definition
                || seen.has(definition.id)
                || (Number.isSafeInteger(candidate?.count) && candidate.count <= 0)
              ) {
                continue;
              }
              if (
                words.length > 0
                && !words.some((entry) => matchesVocabSet(definition.id, entry))
              ) {
                continue;
              }
              seen.add(definition.id);
              published.push({
                id: definition.id,
                label: typeof candidate?.label === 'string' && candidate.label.trim()
                  ? candidate.label.trim()
                  : definition.label,
              });
            }
            return published.length > 0 ? published : [WORD_BANK_VOCAB_SETS[0]];
          }''',
              '''function publishedVocabSetCandidate(candidate, requireCount) {
            try {
              if (!candidate || typeof candidate !== 'object' || Array.isArray(candidate)) {
                return null;
              }
              const id = Object.getOwnPropertyDescriptor(candidate, 'id');
              const count = Object.getOwnPropertyDescriptor(candidate, 'count');
              if (!id?.enumerable || !Object.hasOwn(id, 'value')) return null;
              if (
                requireCount
                && (
                  !count?.enumerable
                  || !Object.hasOwn(count, 'value')
                  || !Number.isSafeInteger(count.value)
                  || count.value <= 0
                )
              ) {
                return null;
              }
              return VOCAB_SET_BY_ID.get(id.value) ?? null;
            } catch {
              return null;
            }
          }

          // Explicit controller metadata is authoritative when supplied. The Word Bank
          // can also stand alone in tests and previews: because progress projects every
          // catalogue item, its year bands are a complete fallback authority. Metadata
          // and rows are intersected so an unavailable or stale zero-sized set cannot be
          // offered as an empty control. Supported IDs also own their visible labels, so
          // stale or accessor-backed metadata cannot silently rename product controls.
          function publishedVocabSets(value, words) {
            const explicit = Array.isArray(value);
            const candidates = explicit ? value : inferredVocabSets(words);
            const seen = new Set();
            const published = [];
            for (const candidate of candidates) {
              const definition = publishedVocabSetCandidate(candidate, explicit);
              if (!definition || seen.has(definition.id)) continue;
              if (
                words.length > 0
                && !words.some((entry) => matchesVocabSet(definition.id, entry))
              ) {
                continue;
              }
              seen.add(definition.id);
              published.push({
                id: definition.id,
                label: definition.label,
              });
            }
            return published.length > 0 ? published : [WORD_BANK_VOCAB_SETS[0]];
          }''',
          )
          replace_once(
              model,
              ''': `${rows.length} of ${inSet.length}`,'',
              ''': `${rows.length} of ${wordCount(inSet.length)}`,'',
          )

          tests = 'tests/word-bank-model.test.mjs'
          marker = "test('word bank filters by vocabulary set, status and normalised live search', () => {"
          addition = '''test('published set metadata is data-only and keeps canonical product labels', () => {
            let getterReads = 0;
            const accessorBacked = {};
            Object.defineProperty(accessorBacked, 'id', {
              enumerable: true,
              get() {
                getterReads += 1;
                return 'y5-6';
              },
            });
            Object.defineProperty(accessorBacked, 'count', {
              enumerable: true,
              value: 1,
            });

            const bank = buildWordBank({
              progress: [
                word(),
                word({
                  runtimeItemId: 'ks2-core:occupy',
                  target: 'occupy',
                  yearBand: '5-6',
                }),
              ],
              vocabularySets: [
                { id: 'core', label: 'All', count: 2 },
                { id: 'y3-4', label: 'Lower years', count: '1' },
                accessorBacked,
                { id: 'y3-4', label: 'Custom label', count: 1 },
              ],
              now: 0,
            });

            assert.equal(getterReads, 0);
            assert.deepEqual(
              bank.vocabSets.map(({ id, label }) => ({ id, label })),
              [
                { id: 'core', label: 'Core' },
                { id: 'y3-4', label: 'Y3–4' },
              ],
            );
          });

          '''
          path = Path(tests)
          source = path.read_text()
          if source.count(marker) != 1:
              raise SystemExit('unexpected Word Bank test insertion marker')
          source = source.replace(marker, addition + marker, 1)
          replacements = {
              "assert.equal(searched.countLabel, '1 of 3');":
                  "assert.equal(searched.countLabel, '1 of 3 words');",
              "assert.equal(missed.countLabel, '0 of 2');":
                  "assert.equal(missed.countLabel, '0 of 2 words');",
              "assert.equal(secureY34.countLabel, '1 of 2');":
                  "assert.equal(secureY34.countLabel, '1 of 2 words');",
              "assert.equal(bank.countLabel, '1 of 1');":
                  "assert.equal(bank.countLabel, '1 of 1 word');",
          }
          for old, new in replacements.items():
              if source.count(old) != 1:
                  raise SystemExit(f'unexpected count-label assertion: {old}')
              source = source.replace(old, new, 1)
          path.write_text(source)
          PY

      - name: Verify the complete Words branch
        run: |
          npm ci
          node --test \
            tests/word-bank-model.test.mjs \
            tests/product-learning-controller.test.mjs \
            tests/product-app-services.test.mjs \
            tests/app-shell.test.mjs
          npm run test:fast
          npm run lint -- --quiet
          npm run build
          git diff --check

      - name: Commit the durable hardening and remove one-use machinery
        run: |
          git add \
            src/app/word-bank-model.js \
            tests/word-bank-model.test.mjs
          git rm .github/workflows/pr54-deep-hardening.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'refactor(words): harden set metadata and counts'
          git push origin HEAD:agent/words-search-vocabulary-sets-clean
