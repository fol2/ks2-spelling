name: Temporary keyboard audit formatting patch

on:
  pull_request:

permissions:
  contents: write

concurrency:
  group: keyboard-audit-format-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  patch:
    name: Format the Keyboard audit assertion
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Fetch the pull-request branch quietly
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          git init -q .
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${REPOSITORY}.git"
          git fetch -q --depth=1 origin "$HEAD_SHA"
          git checkout -q -B "$HEAD_REF" FETCH_HEAD
      - name: Apply the exact formatting correction
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('tests/dependency-policy.test.mjs')
          text = path.read_text()
          old = """  assert.ok(
            report.npm.production.some(({ name }) => name === '@capacitor/keyboard'),
            'the native Keyboard plugin must remain an audited production dependency',
          );
            assert.equal(
              report.npm.webViewBundle.packageNames.includes('@capacitor/keyboard'),
              false,
              'ordinary keyboard ownership must not require the Keyboard JavaScript facade',
            );
          """
          new = """  assert.ok(
              report.npm.production.some(({ name }) => name === '@capacitor/keyboard'),
              'the native Keyboard plugin must remain an audited production dependency',
            );
            assert.equal(
              report.npm.webViewBundle.packageNames.includes('@capacitor/keyboard'),
              false,
              'ordinary keyboard ownership must not require the Keyboard JavaScript facade',
            );
          """
          if old not in text:
              if "    report.npm.production.some(({ name }) => name === '@capacitor/keyboard')" not in text:
                  raise SystemExit('Expected Keyboard audit assertion was not found.')
          else:
              path.write_text(text.replace(old, new, 1))
          PY
          git diff --check
      - name: Commit and push once
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          if git diff --quiet -- tests/dependency-policy.test.mjs; then
            echo "No formatting correction to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/dependency-policy.test.mjs
          git commit -m "style(test): format Keyboard audit assertion"
          git push origin "HEAD:${HEAD_REF}"
