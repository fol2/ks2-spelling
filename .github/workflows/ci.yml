name: B4 continuous integration

on:
  workflow_call:
    inputs:
      certification:
        required: false
        type: boolean
        default: false
  pull_request:
  merge_group:
  push:
    branches:
      - main
      - jamesto/mobile-b3-billing-download
      - jamesto/mobile-b4-vertical-slice
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: b4-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  domain-web:
    name: Domain and web
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "24.18.0"
          cache: npm
      - name: Detect the AI-SDLC Focus Gate
        id: focus
        env:
          EVENT_NAME: ${{ github.event_name }}
          PULL_REQUEST_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/detect-pr-focus-gate.mjs
      - name: Check exact change integrity
        run: git diff --check
      - name: Run F0 documentation and CI contracts
        if: steps.focus.outputs.product == 'false'
        run: >-
          node --test
          tests/ai-sdlc-contract.test.mjs
          tests/ci-workflow-contract.test.mjs
          tests/merge-tier-gate-docs.test.mjs
          tests/native-ci-path-filter.test.mjs
          tests/pr-focus-gate.test.mjs
      - name: Install exact root dependencies
        if: steps.focus.outputs.product == 'true'
        run: npm ci
      - name: Verify frozen B2, vendored and A3 authorities
        if: steps.focus.outputs.product == 'true'
        run: |
          npm run verify:b2-authority
          npm run verify:vendor
          npm run test:upstream:a3
      - name: Materialise deterministic proof-pack inputs
        if: steps.focus.outputs.product == 'true'
        run: npm run build:b3-proof-pack
      # Tier 1 (pull_request): the seconds-fast blocking lane. F0-only
      # documentation stops at the contract gate above; product PRs keep the
      # existing fast test lane. Full native drift and builds remain at merge.
      - name: Run the fast pull-request test lane
        if: github.event_name == 'pull_request' && steps.focus.outputs.product == 'true'
        run: npm run test:fast
      # Tier 2 (merge_group / push / schedule): the full, fail-closed gate that
      # proves the post-merge tree before anything lands on a tracked branch.
      - name: Install gateway dependencies and materialise native bundle inputs
        if: github.event_name != 'pull_request'
        run: |
          npm --prefix gateway ci
          npm run native:sync:check
      - name: Run host-neutral domain and web suite
        if: github.event_name != 'pull_request'
        run: >-
          node --test
          --test-skip-pattern='^(?:B3 native audit is rebuilt from closed fresh inputs without weakening B2|compiled owned Swift inspector accepts the proof pack and rejects the full hostile corpus)$'
          tests/*.test.mjs
      - name: Run real gateway contracts and dry-run
        if: github.event_name != 'pull_request'
        run: |
          npm --prefix gateway test
          npm --prefix gateway run lint
          npm --prefix gateway run deploy:dry-run
          # deploy:dry-run compiles the tracked, build-shaped config only. The
          # real deploy uses the runtime-derived config — a check that never
          # runs on the thing that ships is an absent check wearing a green
          # tick (#156), so compile the deploy-shaped config here too.
          node scripts/rehearse-b3-deploy-config.mjs
          npm --prefix gateway audit --audit-level=high
      - name: Regenerate deterministic B3 proof
        if: steps.focus.outputs.product == 'true'
        run: npm run prove:b3:deterministic
      - name: Lint source and verification code
        if: steps.focus.outputs.product == 'true'
        run: npm run lint
      - name: Build bundled web application
        if: github.event_name != 'pull_request'
        run: npm run build
      - name: Build the offline B4 web application and verify committed evidence
        if: github.event_name != 'pull_request'
        run: |
          npm run build:b4-development
          npm run report:b4-development:check
      # History-sensitive: inspect the merge candidate range, not HEAD^ alone,
      # and run on every event including merge_group and main. Ordinary commits
      # still skip the subset contract after that range has been inspected.
      - name: Prove B4 evidence commits are evidence-only successors
        env:
          EVENT_NAME: ${{ github.event_name }}
          MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          PULL_REQUEST_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: node scripts/prove-b4-evidence-successor.mjs
      - name: Validate B3 pending or complete evidence topology
        run: node scripts/build-b3-exit-report.mjs --check-ci
      - name: Package the verified domain and web build bytes
        if: inputs.certification == true
        run: |
          mkdir -p .native-build/certification-artifacts
          tar -cf .native-build/certification-artifacts/domain-web.tar dist
      - name: Retain the domain and web build for milestone derivation
        if: inputs.certification == true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: certification-domain-web
          path: .native-build/certification-artifacts/domain-web.tar
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  android-compile:
    name: Android unsigned debug and release compile
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    # Tier: native compilation never runs on a pull request (keeps the PR gate
    # under a minute). It runs on merge_group/push/schedule as a fail-closed
    # merge gate, and the nightly schedule runs it unconditionally cold.
    if: github.event_name != 'pull_request'
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "24.18.0"
          cache: npm
      - name: Validate B3 pending or complete evidence topology
        run: node scripts/build-b3-exit-report.mjs --check-ci
      # Fail-closed native path filter: bundled web payload inputs and native
      # release inputs select both native jobs. Unresolved base, empty diff or
      # certification always compile. It can only ever make a merge slower.
      - name: Detect native-affecting changes
        id: filter
        env:
          MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          CERTIFICATION: ${{ inputs.certification }}
        run: node scripts/detect-native-ci-changes.mjs
      - name: Set up Temurin 21 for CI only
        if: steps.filter.outputs.native == 'true' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up committed Gradle wrapper
        if: steps.filter.outputs.native == 'true' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
        with:
          validate-wrappers: true
      - name: Require Android API and Build Tools 36
        if: steps.filter.outputs.native == 'true' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          test -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          test -x "$ANDROID_HOME/platform-tools/adb"
          test -x "$ANDROID_HOME/build-tools/36.0.0/aapt2"
          test -f "$ANDROID_HOME/platforms/android-36/android.jar"
      - name: Install exact JavaScript dependencies
        if: steps.filter.outputs.native == 'true' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: npm ci
      - name: Materialise and verify synced native bundle inputs
        if: steps.filter.outputs.native == 'true' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: npm run native:sync:check
      - name: Compile and test Android debug plus unsigned release application
        if: steps.filter.outputs.native == 'true' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: npm run test:android
      - name: Compile the paired Android sandbox channel
        if: steps.filter.outputs.native == 'true' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          npm run build -- --mode sandbox
          npx --no-install cap sync
          ./android/gradlew -p android :app:assembleSandbox --no-daemon
      - name: Compile the installed B4 Android test seam
        if: steps.filter.outputs.native == 'true' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          npm run sync:b4-development
          ./android/gradlew -p android :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon
          npm run report:b4-development:check
      - name: Compile the B4 unsigned Android release for certification
        if: inputs.certification == true
        run: ./android/gradlew -p android :app:assembleRelease --no-daemon
      - name: Test and compile the unsigned B3 application
        if: steps.filter.outputs.native == 'true' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        working-directory: android
        run: >-
          ./gradlew test bundleB3SandboxProofRelease
          -Pb3Distribution=1
          -Pb3AndroidVersionCode=1
          -Pb3TestedApplicationCommit=1111111111111111111111111111111111111111
          -Pb3ApplicationFingerprint=2222222222222222222222222222222222222222222222222222222222222222
          --no-daemon
      - name: Certify resolved Android dependency closure
        if: steps.filter.outputs.native == 'true' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: npm run certify:android
      - name: Run fresh resolved Android dependency policy tests
        if: steps.filter.outputs.native == 'true' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: npm run test:android-resolved-policy
      - name: Package the verified Android build bytes
        if: inputs.certification == true
        run: |
          mkdir -p .native-build/certification-artifacts
          tar -cf .native-build/certification-artifacts/android-compile.tar \
            .native-build/android/build/app/outputs/apk/debug/app-debug.apk \
            .native-build/android/build/app/outputs/apk/release/app-release-unsigned.apk \
            android/app/build/outputs/apk/debug/app-debug.apk \
            android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk \
            android/app/build/outputs/apk/release/app-release-unsigned.apk \
            android/app/build/outputs/bundle/b3SandboxProofRelease/app-b3SandboxProof-release.aab
      - name: Retain the Android builds for milestone derivation
        if: inputs.certification == true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: certification-android-compile
          path: .native-build/certification-artifacts/android-compile.tar
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  ios-compile:
    name: iOS unsigned Simulator compile
    runs-on: macos-26
    timeout-minutes: 40
    # Tier: same as Android — never on a pull request; a fail-closed merge gate
    # on merge_group/push, unconditionally cold on the nightly schedule.
    if: github.event_name != 'pull_request'
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "24.18.0"
          cache: npm
      - name: Validate B3 pending or complete evidence topology
        run: node scripts/build-b3-exit-report.mjs --check-ci
      - name: Detect native-affecting changes
        id: filter
        env:
          MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          CERTIFICATION: ${{ inputs.certification }}
        run: node scripts/detect-native-ci-changes.mjs
      - name: Require Xcode 26 or newer
        if: steps.filter.outputs.native == 'true' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          xcodebuild -version
          xcode_major="$(xcodebuild -version | awk '/^Xcode / { split($2, version, "."); print version[1] }')"
          test -n "$xcode_major"
          test "$xcode_major" -ge 26
      - name: Install exact JavaScript dependencies
        if: steps.filter.outputs.native == 'true' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: npm ci
      - name: Materialise and verify synced native bundle inputs
        if: steps.filter.outputs.native == 'true' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: npm run native:sync:check
      - name: Compile unsigned iOS Simulator application
        if: steps.filter.outputs.native == 'true' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: npm run test:ios
      - name: Audit packaged iOS privacy manifests against the built App.app
        if: steps.filter.outputs.native == 'true' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: node scripts/audit-dependencies.mjs --require-fresh-ios-privacy-manifests
      - name: Build and inspect paired iOS release artefacts
        if: steps.filter.outputs.native == 'true' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: npm run verify:ios-release-artefacts
      - name: Compile the installed B4 iOS test seam and verify committed evidence
        if: steps.filter.outputs.native == 'true' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          npm run sync:b4-development
          xcodebuild \
            -quiet \
            -project ios/App/App.xcodeproj \
            -scheme B4DevelopmentUITests \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath .native-build/b4-ci \
            CODE_SIGNING_ALLOWED=NO \
            build-for-testing
          npm run report:b4-development:check
      - name: Compile the B4 unsigned iOS release for certification
        if: inputs.certification == true
        run: |
          xcodebuild \
            -quiet \
            -project ios/App/App.xcodeproj \
            -scheme B4DevelopmentUITests \
            -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath .native-build/b4-release-ci \
            CODE_SIGNING_ALLOWED=NO \
            build-for-testing
      - name: Compile unsigned B3 iOS Simulator application
        if: steps.filter.outputs.native == 'true' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: >-
          xcodebuild
          -project ios/App/App.xcodeproj
          -scheme B3SandboxProof
          -configuration B3SandboxProof
          -sdk iphonesimulator
          -derivedDataPath .native-build/b3-ci
          CODE_SIGNING_ALLOWED=NO
          B3_TESTED_APPLICATION_COMMIT=1111111111111111111111111111111111111111
          B3_APPLICATION_FINGERPRINT=2222222222222222222222222222222222222222222222222222222222222222
          B3_VERSION_NAME=0.3.0-b3
          B3_IOS_BUILD_NUMBER=1
          build
      - name: Run owned hostile iOS pack inspector
        if: steps.filter.outputs.native == 'true' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: node scripts/test-ios-pack-inspector.mjs
      - name: Run non-live iOS StoreKit Test
        if: steps.filter.outputs.native == 'true' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: npm run prove:b3:ios-storekit-test
      - name: Package the verified iOS build bytes
        if: inputs.certification == true
        run: |
          mkdir -p .native-build/certification-artifacts
          tar -cf .native-build/certification-artifacts/ios-compile.tar \
            .native-build/ios/Build/Products \
            .native-build/b4-ci/Build/Products \
            .native-build/b4-release-ci/Build/Products \
            .native-build/b3-ci/Build/Products
      - name: Retain the iOS builds for milestone derivation
        if: inputs.certification == true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: certification-ios-compile
          path: .native-build/certification-artifacts/ios-compile.tar
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
