name: PR55 visible-input hardening

on:
  pull_request:
    branches:
      - main
    types: [opened, reopened, synchronize]

permissions:
  contents: write

concurrency:
  group: pr55-visible-input-hardening-${{ github.event.pull_request.number }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  finalize-words:
    if: >-
      github.event.pull_request.head.ref == 'agent/keyboard-reset-visible-input' &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out the clean Words branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          ref: agent/words-search-vocabulary-sets-clean

      - name: Normalize the reviewed Word Bank JSX idempotently
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/app/ProductApp.jsx')
          source = path.read_text()
          pairs = [
              (
                  """  const bank = useMemo(
            () => buildWordBank({
              progress,
              filter,
              vocabSet,
              vocabularySets,
              query,
            }),
            [progress, filter, vocabSet, vocabularySets, query],
          );""".replace('            ()', '  ()').replace('              progress', '    progress').replace('              filter', '    filter').replace('              vocabSet', '    vocabSet').replace('              vocabularySets', '    vocabularySets').replace('              query', '    query').replace('            }),', '  }),').replace('            [progress', '  [progress').replace('          );', ');'),
                  """  const bank = useMemo(
              () => buildWordBank({
                progress,
                filter,
                vocabSet,
                vocabularySets,
                query,
              }),
              [progress, filter, vocabSet, vocabularySets, query],
            );""",
              ),
              (
                  """            <span
            id="bank-result-count"
            className="figure"
            role="status"
            aria-live="polite"
            aria-atomic="true"
          >
            {bank.countLabel}
          </span>""",
                  """            <span
              id="bank-result-count"
              className="figure"
              role="status"
              aria-live="polite"
              aria-atomic="true"
            >
              {bank.countLabel}
            </span>""",
              ),
              (
                  """              enterKeyHint="search"
            maxLength={64}
            aria-describedby="bank-result-count"
            onChange={(event) => setQuery(event.target.value)}
            onKeyDown={(event) => {
              if (event.key === 'Escape' && query) {
                event.preventDefault();
                setQuery('');
              }
            }}
            />""",
                  """              enterKeyHint="search"
              maxLength={64}
              aria-describedby="bank-result-count"
              onChange={(event) => setQuery(event.target.value)}
              onKeyDown={(event) => {
                if (event.key === 'Escape' && query) {
                  event.preventDefault();
                  setQuery('');
                }
              }}
            />""",
              ),
              (
                  """                aria-pressed={option.selected}
              aria-label={`${option.label}, ${option.count} ${option.count === 1 ? 'word' : 'words'}`}
              onClick={() => setVocabSet(option.id)}""",
                  """                aria-pressed={option.selected}
                aria-label={`${option.label}, ${option.count} ${option.count === 1 ? 'word' : 'words'}`}
                onClick={() => setVocabSet(option.id)}""",
              ),
              (
                  """                aria-pressed={option.selected}
              aria-label={`${option.label}, ${option.count} ${option.count === 1 ? 'word' : 'words'}`}
              onClick={() => setFilter(option.id)}""",
                  """                aria-pressed={option.selected}
                aria-label={`${option.label}, ${option.count} ${option.count === 1 ? 'word' : 'words'}`}
                onClick={() => setFilter(option.id)}""",
              ),
              (
                  """      <WordBankScreen
      progress={learningState.progress}
      vocabularySets={learningState.vocabularySets}
      onScreen={showScreen}
        onStart={() => showScreen('setup')}""",
                  """      <WordBankScreen
        progress={learningState.progress}
        vocabularySets={learningState.vocabularySets}
        onScreen={showScreen}
        onStart={() => showScreen('setup')}""",
              ),
          ]
          changed = False
          for bad, good in pairs:
              bad_count = source.count(bad)
              good_count = source.count(good)
              if bad_count == 1 and good_count == 0:
                  source = source.replace(bad, good, 1)
                  changed = True
              elif bad_count == 0 and good_count == 1:
                  pass
              else:
                  raise SystemExit(
                      f'unexpected JSX topology: bad={bad_count}, good={good_count}'
                  )
          if changed:
              path.write_text(source)
          PY

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "24.18.0"
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Verify the finalized Words branch
        run: |
          node --test \
            tests/word-bank-model.test.mjs \
            tests/product-learning-controller.test.mjs \
            tests/product-app-services.test.mjs \
            tests/app-shell.test.mjs
          npm run lint -- --quiet
          npm run build
          git diff --check

      - name: Commit the normalization when needed
        run: |
          git add src/app/ProductApp.jsx
          if git diff --cached --quiet; then
            echo "The clean Words source is already normalized."
            exit 0
          fi
          test "$(git diff --cached --name-only)" = "src/app/ProductApp.jsx"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style(words): normalize the hardened Word Bank"
          git push origin HEAD:agent/words-search-vocabulary-sets-clean

  verify:
    needs: finalize-words
    if: >-
      github.event.pull_request.head.ref == 'agent/keyboard-reset-visible-input' &&
      github.actor != 'github-actions[bot]'
    runs-on: macos-26
    timeout-minutes: 75
    steps:
      - name: Check out the exact reset branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          ref: agent/keyboard-reset-visible-input

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "24.18.0"
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Verify the reset branch in isolation
        run: |
          node --test \
            tests/keyboard-reset-visible-input.test.mjs \
            tests/dependency-policy.test.mjs \
            tests/app-shell.test.mjs
          npm run test:fast
          npm run lint -- --quiet
          git diff --check

      - name: Merge the finalized Words successor without committing
        run: |
          git fetch --no-tags origin \
            refs/heads/agent/words-search-vocabulary-sets-clean:refs/remotes/origin/agent/words-search-vocabulary-sets-clean
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git merge --no-commit --no-ff origin/agent/words-search-vocabulary-sets-clean
          git diff --check HEAD

      - name: Verify the composed Words and keyboard product
        run: |
          node --test \
            tests/keyboard-reset-visible-input.test.mjs \
            tests/dependency-policy.test.mjs \
            tests/word-bank-model.test.mjs \
            tests/product-learning-controller.test.mjs \
            tests/product-app-services.test.mjs \
            tests/app-shell.test.mjs
          npm run lint -- --quiet
          npm run build

      - name: Verify native sync remains stable without Keyboard
        run: npm run native:sync:check

      - name: Compile the integrated unsigned product and UI-test probe
        run: |
          npm run test:ios
          npm run sync:b4-development
          xcodebuild \
            -quiet \
            -project ios/App/App.xcodeproj \
            -scheme B4DevelopmentUITests \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath .native-build/pr55-hardening \
            CODE_SIGNING_ALLOWED=NO \
            build-for-testing
