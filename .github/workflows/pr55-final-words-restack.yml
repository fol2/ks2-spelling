name: PR55 restack on final Words head

on:
  pull_request:
    branches:
      - agent/words-search-vocabulary-sets-clean
    types: [opened, reopened, synchronize]
    paths:
      - '.github/workflows/pr55-final-words-restack.yml'

permissions:
  contents: write

concurrency:
  group: pr55-final-words-restack-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  restack:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/keyboard-reset-visible-input'
    runs-on: macos-26
    timeout-minutes: 110
    env:
      WORDS_HEAD: 4bac9c7fc8900edbe4155e4fff706780e92d9886
    steps:
      - name: Check out the exact keyboard-reset head
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Prove the immutable heads before composing them
        env:
          RESET_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$RESET_HEAD"
          git fetch --no-tags origin \
            refs/heads/agent/words-search-vocabulary-sets-clean:refs/remotes/origin/agent/words-search-vocabulary-sets-clean
          test "$(git rev-parse refs/remotes/origin/agent/words-search-vocabulary-sets-clean)" = "$WORDS_HEAD"
          git merge-base --is-ancestor \
            ae7c5fabc82b561839dcd6db5972fe03637ae257 \
            HEAD
          if git merge-base --is-ancestor "$WORDS_HEAD" HEAD; then
            echo 'The keyboard reset already contains the final Words head.'
            exit 1
          fi

      - name: Compose the final Words changes without committing yet
        run: git merge --no-commit --no-ff "$WORDS_HEAD"

      - name: Verify the composed web and controller contract
        run: |
          npm ci
          node --test \
            tests/keyboard-reset-visible-input.test.mjs \
            tests/visible-input-saving-state.test.mjs \
            tests/dependency-policy.test.mjs \
            tests/word-bank-model.test.mjs \
            tests/product-learning-controller.test.mjs \
            tests/product-app-services.test.mjs \
            tests/app-shell.test.mjs
          npm run test:fast
          npm run lint -- --quiet
          npm run build
          git diff --check

      - name: Verify native dependency and iOS composition
        run: |
          npm run native:sync:check
          npm run test:ios
          npm run sync:b4-development
          xcodebuild \
            -quiet \
            -project ios/App/App.xcodeproj \
            -scheme B4DevelopmentUITests \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath .native-build/pr55-final-restack \
            CODE_SIGNING_ALLOWED=NO \
            build-for-testing
          test -z "$(git diff --name-only)"

      - name: Commit the verified merge and remove one-use machinery
        run: |
          git rm .github/workflows/pr55-final-words-restack.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'merge: restack keyboard reset on final Words head'
          test "$(git rev-parse HEAD^2)" = "$WORDS_HEAD"
          git push origin HEAD:agent/keyboard-reset-visible-input
