name: One-shot Trail fast-lane diagnostic

on:
  push:
    branches:
      - agent/live-trail-meadow

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out Trail branch
        uses: actions/checkout@v4
        with:
          ref: agent/live-trail-meadow
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm

      - name: Install exact dependencies
        run: npm ci --silent

      - name: Capture fast-lane failure
        run: |
          set +e
          npm run test:fast > /tmp/trail-fast.log 2>&1
          status=$?
          set -e
          {
            echo "exit_status=$status"
            echo
            grep -n -E 'not ok|AssertionError|ERR_|Error:|failure|fail [0-9]+' /tmp/trail-fast.log | tail -n 120 || true
            echo
            echo '--- tail ---'
            tail -n 420 /tmp/trail-fast.log
          } > tests/.trail-fast-failure.log

      - name: Commit diagnostic evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/.trail-fast-failure.log
          git commit -m "chore(trail): capture fast-lane failure"
          git push origin HEAD:agent/live-trail-meadow
